// قراءة ملف Excel أو CSV وإرجاع أسماء العمود الأول
function readNamesFromFile(file, cb) {
  if (typeof XLSX === 'undefined') return toast('مكتبة Excel لم تُحمَّل. تأكد من الإنترنت.', 'err');
  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, blank:'' });
      const skip = ['الاسم','الاسم الكامل','اسم التلميذ','اسم الأستاذ','اسم','name','Name'];
      const names = rows.map(r => String(r[0] ?? '').trim()).filter(n => n && !skip.includes(n));
      cb(names);
    } catch (err) { toast('تعذر قراءة الملف', 'err'); }
  };
  r.readAsArrayBuffer(file);
}

async function alertsBlock() {
  const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const { data } = await db.from('student_absences').select('student_id, absence_date, students(full_name)').gte('absence_date', since);
  const m = {};
  (data || []).forEach(a => {
    m[a.student_id] = m[a.student_id] || { id: a.student_id, name: a.students?.full_name || '', days: new Set() };
    m[a.student_id].days.add(a.absence_date);
  });
  const list = Object.values(m).filter(x => x.days.size >= 3).sort((a, b) => b.days.size - a.days.size);
  return list.length
    ? list.map(x => `<div class="row"><span class="grow">⚠️ <b>${esc(x.name)}</b></span>
        <span class="badge">${x.days.size >= 5 ? 'إعذار رسمي ثانٍ' : 'إشعار أولي'} (${x.days.size} أيام)</span>
        <button class="btn small red" onclick="openLetter('${x.id}','warning',${x.days.size})">⚠️ ${x.days.size >= 5 ? 'إعذار ثانٍ' : 'إشعار أولي'}</button>
        <button class="btn small" onclick="openLetter('${x.id}','call')">📨 استدعاء</button></div>`).join('')
    : '<p class="muted">✅ لا توجد حالات غياب متكرر خلال الأسبوع</p>';
}

async function weekChart() {
  const days = [...Array(7)].map((_, i) => new Date(Date.now() - (6 - i) * 864e5).toISOString().slice(0, 10));
  const { data } = await db.from('student_absences').select('absence_date').gte('absence_date', days[0]);
  const cnt = {};
  (data || []).forEach(a => cnt[a.absence_date] = (cnt[a.absence_date] || 0) + 1);
  const max = Math.max(1, ...days.map(d => cnt[d] || 0));
  const el = $('wk'); if (!el) return;
  el.innerHTML = `<h3>📈 الغياب خلال 7 أيام</h3><div class="bars">${days.map(d => {
    const v = cnt[d] || 0, h = Math.round(v / max * 100);
    return `<div class="bar-col"><div class="bar" style="height:${Math.max(6, h)}%"><span>${v}</span></div><small>${d.slice(5)}</small></div>`;
  }).join('')}</div>`;
}

async function viewClasses() {
  const cls = await classesList();
  const { data: stc } = await db.from('students').select('class_id');
  const cntS = {};
  (stc || []).forEach(s => cntS[s.class_id] = (cntS[s.class_id] || 0) + 1);
  const canEdit = profile.role === 'directeur';
  let html = '';
  if (canEdit) {
    html += `<div class="card no-print">
      <b>رمز المدرسة</b> (أعطه للموظفين والأساتذة عند التسجيل):
      <input type="text" value="${esc(profile.school_id)}" readonly onclick="this.select()" style="margin-top:6px">
      <p class="muted">حدد عدد الأقسام في كل سنة (من 1 إلى 17) واضغط تطبيق. الأقسام الزائدة تُحذف بعد التأكيد.</p>
    </div>`;
  }
  for (let lv = 1; lv <= maxLevel(); lv++) {
    const mine = cls.filter(c => c.level === lv);
    const count = mine.length ? Math.max(...mine.map(c => c.number)) : 0;
    html += `<div class="lvl">
      <div class="lvl-head">
        <h3 style="margin:0;border:0;padding:0">السنة ${lv} — ${count} قسم</h3>
        ${canEdit ? `<div class="toolbar no-print" style="margin:0">
          <label>عدد الأقسام: <input type="number" id="lvl-${lv}" min="0" max="17" value="${count || 8}"></label>
          <button class="btn green small" onclick="setLevelCount(${lv})">تطبيق</button>
        </div>` : ''}
      </div>
      <div class="grid" style="margin-top:12px">
        ${mine.length ? mine.map(c => `<a class="cls" href="#/students" onclick="pickClass('${c.id}')">${classLabel(c)}<br><small>${cntS[c.id] || 0} تلميذ</small></a>`).join('')
                      : '<p class="muted">لا توجد أقسام لهذه السنة</p>'}
      </div>
    </div>`;
  }
  content().innerHTML = html;
}

function pickClass(id) { sessionStorage.setItem('tifo_class', id); }

async function setLevelCount(lv) {
  const N = Math.max(0, Math.min(17, parseInt($('lvl-' + lv).value, 10) || 0));
  if (N > 0) {
    const rows = [];
    for (let n = 1; n <= N; n++) rows.push({ school_id: profile.school_id, level: lv, number: n });
    const { error } = await db.from('classes').upsert(rows, { onConflict:'school_id,level,number', ignoreDuplicates:true });
    if (error) return toast(error.message, 'err');
  }
  if (N < 17) {
    if (!confirm(`سيتم حذف الأقسام من ${N + 1} إلى 17 في السنة ${lv}. متابعة؟`)) return;
    const { error } = await db.from('classes').delete().eq('school_id', profile.school_id).eq('level', lv).gt('number', N);
    if (error) return toast(error.message, 'err');
  }
  toast(`تم تحديث أقسام السنة ${lv} إلى ${N} قسم`);
  viewClasses();
}

function selectedClass() {
  const v = $('cls')?.value;
  if (!v) { toast('اختر قسما أولا', 'err'); return null; }
  return v;
}

async function insertStudents(names) {
  const cid = selectedClass(); if (!cid) return;
  if (!names.length) return toast('لا توجد أسماء لإضافتها', 'err');
  const { error } = await db.from('students').insert(names.map(n => ({ school_id: profile.school_id, class_id: cid, full_name: n, reg_no: regNo() })));
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast(`تمت إضافة ${names.length} تلميذ ✅`);
  viewStudents();
}

async function addStudentFull(e) {
  e.preventDefault();
  const cid = selectedClass(); if (!cid) return;
  const row = {
    school_id: profile.school_id, class_id: cid, full_name: [$('s_last').value, $('s_first').value].map(x => x.trim()).filter(Boolean).join(' '),
    birth_date: $('s_birth').value || null, rfid_card: $('s_rfid').value.trim() || null, reg_no: regNo(),
    parent_relation: $('s_rel').value, parent_name: $('s_parent').value.trim() || null,
    parent_phone: $('s_phone').value.trim() || null, address: $('s_addr').value.trim() || null,
    parent_email: $('s_mail') ? ($('s_mail').value.trim() || null) : null
  };

  if (error) return toast('خطأ: ' + error.message, 'err');

async function delStudent(id) {
  if (!confirm('هل تريد حذف هذا التلميذ؟')) return;
  const { error } = await db.from('students').delete().eq('id', id);
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تم الحذف');
  loadStudents();
}

function exportStudents() {
  const rows = [['رقم التسجيل','الاسم','تاريخ الميلاد','RFID','ولي الأمر','الهاتف']]
    .concat((window._students || []).map(s => [s.reg_no || '', s.full_name, s.birth_date || '', s.rfid_card || '', `${s.parent_relation || ''} ${s.parent_name || ''}`, s.parent_phone || '']));
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'قائمة-التلاميذ.csv'; a.click();
  URL.revokeObjectURL(url);
}

const SUBJECTS = ['لغة عربية','لغة فرنسية','لغة إنجليزية','علوم طبيعية','علوم فيزيائية','رياضيات','إعلام آلي','موسيقى','تربية تشكيلية','علوم اجتماعية','تربية بدنية','أمازيغية','تربية إسلامية','الاجتماعيات'];

async function loadTimetable() {
  if (window._ttMode === 'teacher') return loadTeacherTT();
  const cid = $('tcls').value, grp = Number($('tgrp').value);
  const { data } = await db.from('timetable').select('*').eq('class_id', cid).in('grp', [0, 1, 2]);
  const cell = {};
  (data || []).forEach(r => { const k = r.weekday + '-' + r.period; (cell[k] = cell[k] || []).push(r); });
  window._ttCell = cell; window._ttCls = cid; window._ttGrp = grp;
  const cls = window._cls.find(c => c.id === cid);
  $('tt').innerHTML = `<div class="tt-title">${cls ? classLabel(cls) : ''} — الفوج ${grp}
    <small class="muted">(اضغط على أي خانة لاختيار المادة والأستاذ والقاعة)</small></div>
  <table class="sheet">
    <tr><th>الفترة</th>${WEEKDAYS.map(d => `<th>${d}</th>`).join('')}</tr>
    ${PERIODS.map(p => `<tr><th>${p[1]}<br><small>${TIMES[p[0]]}</small></th>${WEEKDAYS.map((d, w) => {
      const list = cell[w + '-' + p[0]] || [];
      const item = c => `<div class="slot-item"><b>${esc(c.subject || '')}</b><br><small>${esc(teacherName(c.teacher_id))}${c.room ? ' · ' + esc(c.room) : ''}</small></div>`;
      const full = list.filter(c => c.grp === 0);
      const g1 = list.filter(c => c.grp === 1);
      const g2 = list.filter(c => c.grp === 2);
      const inner = full.length
        ? full.map(item).join('')
        : `<div style="display:flex;gap:4px"><div style="flex:1;min-width:0">${g1.map(item).join('') || '<span class="muted">الفوج 1: + إضافة</span>'}</div><div style="flex:1;min-width:0;border-right:1px dashed #d4af37;padding-right:4px">${g2.map(item).join('') || '<span class="muted">الفوج 2: + إضافة</span>'}</div></div>`;
      return `<td class="slot ${list.length ? 'filled' : ''}" onclick="openSlot(${w},${p[0]})">${inner}</td>`;
    }).join('')}</tr>`).join('')}
  </table>`;
}

function teacherName(id) {
  const t = (window._teachers || []).find(x => x.id === id);
  return t ? t.full_name : '';
}

  const grpSel = c ? c.grp : window._ttGrp;

  const modal = document.createElement('div');
  modal.className = 'modal'; modal.id = 'slotModal';
  modal.innerHTML = `<div class="mbox">
    <h3 style="border:0;margin:0 0 4px">📝 إضافة حصة في استعمال الزمن</h3>
    <p class="muted">${cls ? classLabel(cls) : ''}</p>

      <label>تقسيم الفوج<select id="sb_grp">

        <option value="1" ${grpSel === 1 ? 'selected' : ''}>فوج 1</option>
        <option value="2" ${grpSel === 2 ? 'selected' : ''}>فوج 2</option></select></label>
      ${roomFieldsHTML(c?.room)}
      <label style="grid-column:1/-1"><input type="checkbox" id="sb_double" style="width:auto"> حصتان متتاليتان (نفس المادة)</label>
      <label style="grid-column:1/-1">المادة<select id="sb_sub">

      <label style="grid-column:1/-1">الأستاذ المكلف<select id="sb_t" onchange="sbAutoSubject()" ${profile.role === 'enseignant' ? 'disabled' : ''}>
        <option value="">— اختر الأستاذ —</option>
        ${(window._teachers || []).map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.full_name)}</option>`).join('')}</select></label>
    </div>

    </div>

async function loadAbs() {
  const cid = $('cls').value, dt = $('dt').value, per = Number($('per').value);
  const [{ data: st }, { data: ab }] = await Promise.all([
    db.from('students').select('id,full_name').eq('class_id', cid).order('full_name'),
    db.from('student_absences').select('student_id,status,excuse').eq('class_id', cid).eq('absence_date', dt).eq('period', per)
  ]);
  const rec = {};
  (ab || []).forEach(a => rec[a.student_id] = a);
  const state = {};
  (st || []).forEach(s => {
    const r = rec[s.id];
    state[s.id] = r
      ? { status: r.status === 'متأخر' ? 'late' : 'absent', excuse: r.excuse || 'بدون تبرير', saved: true }
      : { status: 'present', excuse: 'بدون تبرير', saved: false };
  });
  window._abs = { students: st || [], state };
  renderAbs();
}

function renderAbs() {
  const { students, state } = window._abs;
  const q = ($('q')?.value || '').trim();
  const seg = (id, k, label, c) => `<button type="button" class="seg ${state[id].status === k ? 'on ' + c : ''}" onclick="setSt('${id}','${k}')">${label}</button>`;
  $('list').innerHTML = `<table><tr><th>#</th><th>اسم التلميذ</th><th>الحالة</th><th>التبرير</th></tr>` +
    students.map((s, i) => {
      if (q && !s.full_name.includes(q)) return '';
      const st = state[s.id];
      return `<tr><td>${i + 1}</td>
        <td>${esc(s.full_name)} ${st.saved ? '<span class="badge ok">مسجّل</span>' : ''}</td>
        <td><div class="seg-wrap">${seg(s.id, 'present', 'حاضر', 'g')}${seg(s.id, 'late', 'متأخر', 'o')}${seg(s.id, 'absent', 'غائب', 'r')}</div></td>
        <td>${st.status === 'present' ? '-' : `<select onchange="setEx('${s.id}',this.value)">${EXCUSES.map(x => `<option ${x === st.excuse ? 'selected' : ''}>${x}</option>`).join('')}</select>`}</td>
      </tr>`;
    }).join('') + `</table>`;
  updStats();
}

function setSt(id, k) { window._abs.state[id].status = k; renderAbs(); }
function setEx(id, v) { window._abs.state[id].excuse = v; }
function markAll(k) { Object.keys(window._abs.state).forEach(id => window._abs.state[id].status = k); renderAbs(); }

function updStats() {
  const { students, state } = window._abs;
  const n = students.length;
  const absent = students.filter(s => state[s.id].status === 'absent').length;
  const late = students.filter(s => state[s.id].status === 'late').length;
  const present = n - absent - late;
  const rate = n ? Math.round(present / n * 100) : 0;
  $('abstats').innerHTML = `
    <div class="mini s1b">تلاميذ القسم<b>${n}</b></div>
    <div class="mini s2b">الحاضرون<b>${present}</b></div>
    <div class="mini s4b">الغائبون<b>${absent}</b></div>
    <div class="mini s3b">المتأخرون<b>${late}</b></div>
    <div class="mini s5b">نسبة الحضور<b>${rate}%</b></div>`;
}

async function buildTemplate(type, dt) {
  if (type === 'call' || type === 'warning') return letterText(type, dt);
  if (type === 'students' || type === 'counselor') {
    const [cls, { data: ab }] = await Promise.all([
      classesList(),
      db.from('student_absences').select('period,class_id,students(full_name)').eq('absence_date', dt)
    ]);
    const lines = [`📋 غيابات التلاميذ — ${dt}`, `مجموع الغيابات: ${(ab || []).length}`, ''];
    cls.forEach(c => {
      const items = (ab || []).filter(a => a.class_id === c.id);
      if (!items.length) return;
      lines.push(`• ${classLabel(c)}:`);
      PERIODS.forEach(p => {
        const names = items.filter(a => a.period === p[0]).map(a => a.students?.full_name).filter(Boolean);
        if (names.length) lines.push(`    ${p[1]}: ${names.join('، ')}`);
      });
    });
    if (lines.length === 3) lines.push('لا توجد غيابات مسجلة في هذا اليوم.');
    if (type === 'students') return lines.join('\n');
    return lines.join('\n') + '\n\n' + await buildTeachersText(dt);
  }
  return buildTeachersText(dt).then(t => `📋 غيابات الأساتذة — ${dt}\n\n${t}`);
}

async function letterText(type, dt) {
  const head = `الجمهورية الجزائرية الديمقراطية الشعبية\nوزارة التربية الوطنية\n${schoolName || '........................'}\n\n`;
  const name = prompt('اسم التلميذ:') || '........................';
  const cls = prompt('القسم (مثال: 1 م 1):') || '........';
  const parent = prompt('اسم ولي الأمر:') || '........................';
  if (type === 'call') {
    const time = prompt('وقت الموعد (مثال 10:00):') || '........';
    return head + `استدعاء رسمي لولي أمر التلميذ\n\nإلى السيد(ة): ${parent}\nولي أمر التلميذ(ة): ${name} — القسم: ${cls}\n\nيرجى الحضور إلى مقر المؤسسة يوم ${dt} على الساعة ${time} لمقابلة مستشار التربية.\n\nمستشار التربية: ........................\nمدير المؤسسة: ........................`;
  }
  const days = prompt('عدد أيام الغياب المتكررة:') || '3';
  return head + `إنذار رسمي بالغياب المتكرر\n\nإلى السيد(ة): ${parent}\nولي أمر التلميذ(ة): ${name} — القسم: ${cls}\n\nنحيطكم علما بأن ابنكم/ابنتكم تغيّب عن الدراسة ${days} أيام دون مبرر رسمي، ونرجو منكم الحضور العاجل لتسوية وضعيته.\n\nمدير المؤسسة: ........................`;
}

async function buildTeachersText(dt) {
  const { data } = await db.from('teacher_absences').select('teacher_id, teachers(full_name)').eq('absence_date', dt);
  const names = (data || []).map(a => a.teachers?.full_name).filter(Boolean);
  return names.length ? `الأساتذة الغائبون (${names.length}): ${names.join('، ')}` : 'لا يوجد أساتذة غائبون في هذا اليوم.';
}

const CALL_REASONS = ['تراجع في التحصيل الدراسي','مقابلة تنسيقية وإرشادية دورية','تأخرات صباحية مستمرة','سلوك غير لائق داخل القسم','غياب متكرر دون تبرير'];
const WARN_REASON = 'غياب متكرر دون تبرير رسمي';



async function openLetter(id, type, days = 3) {
  let s = (window._par || []).find(x => x.id === id);
  if (!s) {
    const { data } = await db.from('students').select('*, classes(level,number)').eq('id', id).maybeSingle();
    if (!data) return toast('التلميذ غير موجود', 'err');
    s = data;
    window._par = [...(window._par || []), s];
  }
  closeLetter();
  const reasons = type === 'call' ? CALL_REASONS : [WARN_REASON];
  const modal = document.createElement('div');
  modal.className = 'modal'; modal.id = 'letterModal';
  modal.innerHTML = `<div class="mbox">
    <div class="toolbar no-print" style="justify-content:space-between">
      <h3 style="margin:0;border:0">${type === 'call' ? '📨 استدعاء ولي أمر' : '⚠️ إنذار رسمي بالغياب'}</h3>
      <button class="btn gray small" onclick="closeLetter()">✖ إغلاق</button>
    </div>
    <div class="toolbar no-print">
      <select id="lr" onchange="refreshLetter('${id}','${type}')">${reasons.map(r => `<option>${r}</option>`).join('')}</select>
      <input type="date" id="ld" value="${today()}" onchange="refreshLetter('${id}','${type}')">
      ${type === 'call'
        ? `<input type="time" id="lt" value="10:00" onchange="refreshLetter('${id}','${type}')">`
        : `<label>عدد الأيام <input type="number" id="lday" value="${days}" min="1" style="width:80px" onchange="refreshLetter('${id}','${type}')"></label>`}
    </div>
    <textarea id="lbody" class="report no-print" rows="9" oninput="$('letterPrint').textContent=this.value"></textarea>
    <div id="letterPrint" class="letter"></div>
    <div class="toolbar no-print">
      <button class="btn" onclick="printLetter()">🖨️ طباعة الإشعار</button>
      <a class="btn green" id="lwa" target="_blank">💬 إرسال عبر واتساب</a>
      <a class="btn" id="lmail" target="_blank">✉️ بريد إلكتروني</a>
    </div>
  </div>`;
  document.body.appendChild(modal);
  refreshLetter(id, type);
}

function closeLetter() { const m = $('letterModal'); if (m) m.remove(); }

function refreshLetter(id, type) {
  const s = window._par.find(x => x.id === id);
  if (!s) return;
  const reason = $('lr').value, dt = $('ld').value;
  const cls = s.classes ? classLabel(s.classes) : '—';
  const parent = `${s.parent_relation || 'ولي'} ${s.parent_name || ''}`.trim();
  const head = `الجمهورية الجزائرية الديمقراطية الشعبية\nوزارة التربية الوطنية\nمديرية التربية\n${schoolName || '........................'}\n\n`;
  let text;
  if (type === 'call') {
    text = head + `استدعاء رسمي لولي أمر\n\nإلى السيد(ة): ${parent}\nولي أمر التلميذ(ة): ${s.full_name} — القسم: ${cls}\n\n` +
      `يرجى الحضور إلى مقر المؤسسة يوم ${dt} على الساعة ${$('lt').value} لمقابلة مستشار التربية أو مدير المؤسسة.\n` +
      `سبب الاستدعاء: ${reason}\n\nتوقيع مستشار التربية: ........................\nختم وتوقيع مدير المؤسسة: ........................`;
  } else {
    const ttl = Number($('lday').value) >= 5 ? 'إعذار رسمي ثانٍ بالغياب المتكرر' : 'إشعار أولي بالغياب المتكرر';
    text = head + `${ttl}\n\nإلى السيد(ة): ${parent}\nولي أمر التلميذ(ة): ${s.full_name} — القسم: ${cls}\n\n` +
      `نحيطكم علما بأن ابنكم/ابنتكم تغيّب عن الدراسة ${$('lday').value} أيام، ونرجو منكم الحضور العاجل لتسوية وضعيته.\n` +
      `سبب الإنذار: ${reason}\n\nتوقيع مدير المؤسسة: ........................`;
  }
  $('lbody').value = text;
  $('letterPrint').textContent = text;
  const mEl = $('lmail');
  if (mEl) {
    if (s.parent_email) { mEl.href = 'mailto:' + s.parent_email + '?subject=' + encodeURIComponent('إشعار رسمي من المدرسة') + '&body=' + encodeURIComponent(text); mEl.style.display = ''; }
    else mEl.style.display = 'none';
  }
  const a = $('lwa');
  if (s.parent_phone) { a.href = waLink(s.parent_phone, text); a.onclick = null; }
  else { a.href = '#'; a.onclick = e => { e.preventDefault(); toast('لا يوجد هاتف لولي الأمر', 'err'); }; }
}

}

// ---------- النسخ الاحتياطي والاستيراد (للمدير) ----------
async function exportBackup() {
  const get = async t => (await db.from(t).select('*')).data || [];
  const backup = {
    app: 'TIFO', version: 'v10', exported_at: new Date().toISOString(), school: schoolName,
    classes: await get('classes'), teachers: await get('teachers'), students: await get('students'),
    student_absences: await get('student_absences'), teacher_absences: await get('teacher_absences'),
    counselor_reports: await get('counselor_reports'), timetable: await get('timetable')
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = `tifo-backup-${today()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('تم تنزيل النسخة الاحتياطية ✅');
}

async function importBackup(input) {
  if (profile.role !== 'directeur') return toast('الاستيراد للمدير فقط', 'err');
  const f = input.files[0]; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { return toast('الملف غير صالح', 'err'); }
  if (!confirm('سيتم دمج بيانات النسخة الاحتياطية مع بيانات المدرسة الحالية. متابعة؟')) return;
  toast('جار الاستيراد...');
  const clsMap = {}, tMap = {}, sMap = {};
  let curC = await classesList();
  for (const c of (data.classes || [])) {
    let m = curC.find(x => x.level === c.level && x.number === c.number);
    if (!m) {
      const { data: ins, error } = await db.from('classes').insert({ school_id: profile.school_id, level: c.level, number: c.number }).select().single();
      if (error) return toast('خطأ في الأقسام: ' + error.message, 'err');
      m = ins; curC.push(m);
    }
    clsMap[c.id] = m.id;
  }
  let curT = await teachersList();
  for (const t of (data.teachers || [])) {
    let m = curT.find(x => x.full_name === t.full_name);
    if (!m) {
      const { data: id, error } = await db.rpc('add_teacher', { p_name: t.full_name, p_subject: t.subject || '', p_phone: t.phone || '' });
      if (error) return toast('خطأ في الأساتذة: ' + error.message, 'err');
      m = { id, full_name: t.full_name }; curT.push(m);
    }
    tMap[t.id] = m.id;
  }
  const { data: curS } = await db.from('students').select('id,full_name,class_id');
  const list = curS || [];
  for (const s of (data.students || [])) {
    const cid = clsMap[s.class_id]; if (!cid) continue;
    let m = list.find(x => x.full_name === s.full_name && x.class_id === cid);
    if (!m) {
      const row = { school_id: profile.school_id, class_id: cid, full_name: s.full_name, reg_no: s.reg_no || regNo(),
        birth_date: s.birth_date || null, rfid_card: s.rfid_card || null, parent_relation: s.parent_relation || null,
        parent_name: s.parent_name || null, parent_phone: s.parent_phone || null, address: s.address || null };
      const { data: ins, error } = await db.from('students').insert(row).select().single();
      if (error) return toast('خطأ في التلاميذ: ' + error.message, 'err');
      m = ins; list.push(m);
    }
    sMap[s.id] = m.id;
  }
  const ab = (data.student_absences || []).filter(a => sMap[a.student_id] && clsMap[a.class_id]).map(a => ({
    school_id: profile.school_id, student_id: sMap[a.student_id], class_id: clsMap[a.class_id],
    absence_date: a.absence_date, period: a.period, status: a.status || 'غائب', excuse: a.excuse || 'بدون تبرير', recorded_by: me.id }));
  if (ab.length) {
    const { error } = await db.from('student_absences').upsert(ab, { onConflict: 'student_id,absence_date,period' });
    if (error) return toast('خطأ في الغيابات: ' + error.message, 'err');
  }
  const tab = (data.teacher_absences || []).filter(a => tMap[a.teacher_id]).map(a => ({
    school_id: profile.school_id, teacher_id: tMap[a.teacher_id], absence_date: a.absence_date, recorded_by: me.id }));
  if (tab.length) {
    const { error } = await db.from('teacher_absences').insert(tab);
    if (error) return toast('خطأ في غيابات الأساتذة: ' + error.message, 'err');
  }
  const reps = Array.isArray(data.counselor_report) ? data.counselor_report : (data.counselor_report ? [data.counselor_report] : []);
  for (const r of reps) {
    const lessons = (Array.isArray(r.lessonsNotGiven) ? r.lessonsNotGiven : []).map(l => ({
      teacher: l.teacher || l.name || '', subject: l.subject || '', class: l.class || l.className || '', hours: l.hours || '', reason: l.reason || '' }));
    const { error } = await db.from('counselor_reports').insert({ school_id: profile.school_id, author_id: me.id, report_date: r.date || today(),
      content: { type: 'counselor', body: r.counselor_notes || '', lessons, actions: r.procedures || '', notes: r.notes || '',
        director_notes: r.director_notes || '', stats: { students_absent: 0, teachers_absent: 0 } } });
    if (error) return toast('خطأ في التقارير: ' + error.message, 'err');
  }
  toast(`تم الاستيراد: ${Object.keys(clsMap).length} قسم، ${Object.keys(tMap).length} أستاذ، ${Object.keys(sMap).length} تلميذ ✅`);
  viewSettings();
}

async function setRole(id, requested) {
  const role = requested || ($('r-' + id) ? $('r-' + id).value : null);
  const maslaha = $('m-' + id) ? $('m-' + id).value : null;
  const subject = $('sj-' + id) ? ($('sj-' + id).value || null) : null;

  if (error) return toast('خطأ: ' + error.message, 'err');

    const { data: linked } = await db.from('teachers').select('id').eq('profile_id', id).maybeSingle();
    if (!linked && p) {
      const { data: byName } = await db.from('teachers').select('id').eq('school_id', profile.school_id).eq('full_name', p.full_name).maybeSingle();

}

async function saveGrades() {
  const cid = $('gcls').value, sub = $('gsub').value, kind = $('gkind').value, dt = $('gdt').value;
  const rows = [], dels = [];
  let bad = false;
  document.querySelectorAll('.gscore').forEach(i => {
    const v = i.value.trim();
    if (v === '') return dels.push(i.dataset.sid);
    const n = Number(v);
    if (isNaN(n) || n < 0 || n > 20) { bad = true; return; }
    rows.push({ school_id: profile.school_id, student_id: i.dataset.sid, class_id: cid, subject: sub, kind, grade_date: dt, score: n, recorded_by: me.id });
  });
  if (bad) return toast('النقطة يجب أن تكون بين 0 و 20', 'err');
  if (rows.length) {
    const { error } = await db.from('grades').upsert(rows, { onConflict: 'student_id,subject,kind,grade_date' });
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  for (const sid of dels) await db.from('grades').delete().eq('student_id', sid).eq('subject', sub).eq('kind', kind).eq('grade_date', dt);
  toast('تم حفظ النقاط ✅');
  loadGrades();
}

    const { error } = await db.from('profiles').update({ full_name: name }).eq('id', me.id);
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  const upd = {};
  if (email && email !== me.email) upd.email = email;
  if (pw) {
    if (pw.length < 8) return toast('كلمة المرور 8 أحرف على الأقل', 'err');
    upd.password = pw;
  }
  if (Object.keys(upd).length) {
    const { error } = await db.auth.updateUser(upd);
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  toast('تم حفظ بيانات الحساب ✅');
  boot();
}

      <div class="dcard stat-c"><h3>التلاميذ</h3><b>${st.count ?? 0}</b><small>إجمالي التلاميذ</small></div>
      <div class="dcard stat-c"><h3>الأساتذة</h3><b>${tc.count ?? 0}</b><small>إجمالي الأساتذة</small></div>
      <div class="dcard qr"><h3>رمز التسجيل</h3>
        <div id="dashQR" class="qrbox"></div>
        <div class="codebox"><code>${esc(profile.school_id)}</code>
          <button class="btn small" onclick="copyDashCode()">نسخ الرمز</button>
          <button class="btn small" type="button" onclick="printDashQR()">🖨️ طباعة الكود</button></div></div>
      <div class="dcard chart"><h3>الغياب خلال 7 أيام</h3>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="line"><polyline points="${pts}"/></svg>
        <div class="days">${days7.map(d => `<span>${d.slice(5)}</span>`).join('')}</div></div>
      <div class="dcard alerts"><h3>تنبيهات الغياب المتكرر</h3>
        ${alerts.length ? `<table><tr><th>التلميذ</th><th>القسم</th><th>عدد الغيابات</th><th>الحالة</th></tr>

async function buildTablesHTML(dt) {
  const [cls, { data: ab }, { data: tab }] = await Promise.all([
    classesList(),
    db.from('student_absences').select('period,class_id,status,students(full_name)').eq('absence_date', dt),
    db.from('teacher_absences').select('teachers(full_name)').eq('absence_date', dt)
  ]);
  const map = {};
  (ab || []).forEach(a => {
    const k = a.class_id + '-' + a.period;
    (map[k] = map[k] || []).push((a.students?.full_name || '') + (a.status === 'متأخر' ? ' (م)' : ''));
  });
  let h = `<h3>📊 ورقة غياب التلاميذ ليوم ${esc(dt)}</h3>
    <table><tr><th>القسم</th>${PERIODS.map(p => `<th>${p[1]}</th>`).join('')}</tr>
    ${cls.map(c => `<tr><td><b>${classLabel(c)}</b></td>${PERIODS.map(p => {
      const n = map[c.id + '-' + p[0]] || [];
      return `<td>${n.length ? n.map(esc).join('، ') : '-'}</td>`;
    }).join('')}</tr>`).join('')}</table>`;
  const names = (tab || []).map(t => t.teachers?.full_name).filter(Boolean);
  h += `<h3>👨‍🏫 غياب الأساتذة ليوم ${esc(dt)}</h3>` + (names.length
    ? `<table><tr><th>#</th><th>اسم الأستاذ</th></tr>${names.map((n, i) => `<tr><td>${i + 1}</td><td>${esc(n)}</td></tr>`).join('')}</table>`
    : '<p>لا يوجد أساتذة غائبون في هذا اليوم.</p>');
  return h;
}

async function saveSupervisorNew(e) {
  e.preventDefault();
  const name = $('sv_name').value.trim();
  const phone = $('sv_phone').value.trim() || null;
  const mail = $('sv_mail').value.trim() || null;
  const addr = $('sv_addr') ? ($('sv_addr').value.trim() || null) : null;
  const all = document.querySelector('.sv_all').checked;
  const lvs = [...document.querySelectorAll('.sv_lv:checked')].map(x => Number(x.value));
  const cls = [...document.querySelectorAll('.sv_cl:checked')].map(x => x.value);
  let id = supEditId;
  if (id) {
    const { error } = await db.from('supervisors').update({ full_name: name, phone, email: mail, address: addr }).eq('id', id);
    if (error) return toast('خطأ: ' + error.message, 'err');
    await db.from('supervisor_scopes').delete().eq('supervisor_id', id);
  } else {
    const { data, error } = await db.from('supervisors').insert({ school_id: profile.school_id, full_name: name, phone, email: mail, address: addr }).select().single();
    if (error) return toast('خطأ: ' + error.message, 'err');
    id = data.id;
  }
  const scopes = all ? [{ level: null, class_id: null }]
    : lvs.map(l => ({ level: l, class_id: null })).concat(cls.map(c => ({ level: null, class_id: c })));
  if (scopes.length) {
    const { error } = await db.from('supervisor_scopes').insert(scopes.map(s => ({ school_id: profile.school_id, supervisor_id: id, level: s.level, class_id: s.class_id })));
    if (error) return toast('خطأ في النطاق: ' + error.message, 'err');
  }
  toast('تم حفظ المشرف ✅');
  viewSupervisors();
}

  const { error } = await db.from('supervisors').delete().eq('id', id);
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تم الحذف');
  viewSupervisors();
}

async function saveSupport(e) {
  e.preventDefault();
  const d = supFormData();
  if (!d.rows.length) return toast('أضف تلميذا واحدا على الأقل', 'err');
  const bad = d.rows.find(r => !r.id);
  if (bad) return toast('الاسم غير مسجل في المدرسة: ' + bad.name, 'err');
  const { error } = await db.from('support_sessions').insert({
    school_id: profile.school_id, kind: d.kind, class_id: null, subject: d.subject,
    teacher_name: d.teacher || null, supervisor_id: d.supervisorId, supervisor_name: d.supervisor || null,
    session_date: d.date, hours: d.hours || null, attendees: d.rows.map(r => r.id), attendance: d.rows.filter(r => r.id).map(r => ({ id: r.id, status: r.status })), notes: d.notes || null, recorded_by: me.id
  });
  if (error) return toast('خطأ: ' + error.message, 'err');
  await archiveSave(`سجل ${d.kind} — ${d.subject} — ${d.date}`, `<div class="pr-body">${supSessionHTML(d)}</div>`);
  toast('تم حفظ السجل في العلبة ✅');
  viewSupport();
}

function printSupportForm() {
  const d = supFormData();
  if (!d.subject) return toast('اكتب المادة قبل الطباعة', 'err');
  if (!d.rows.length) return toast('أضف تلميذا واحدا على الأقل', 'err');
  openPrint(`سجل ${d.kind} — ${d.subject}`, supSessionHTML(d));
}

async function loadSupList() {

async function printSupportRecord(id) {
  const { data: r } = await db.from('support_sessions').select('*').eq('id', id).single();
  if (!r) return;
  const ids = r.attendees && r.attendees.length ? r.attendees : ['00000000-0000-0000-0000-000000000000'];
  const { data: st } = await db.from('students').select('id,full_name,classes(level,number)').in('id', ids);
  const rows = (st || []).map(s => ({ name: s.full_name, level: s.classes ? 'السنة ' + s.classes.level + (CYCLE === 'secondaire' ? ' ثانوي' : ' متوسط') : '', cls: s.classes ? classLabel(s.classes) : '' }));
  openPrint(`سجل ${r.kind} — ${r.subject || ''}`, supSessionHTML({
    kind: r.kind, date: r.session_date, subject: r.subject, hours: r.hours, teacher: r.teacher_name,
    supervisor: r.supervisor_name, rows, notes: r.notes
  }));
}

async function deleteSupport(id) {
  if (!confirm('حذف هذا السجل؟')) return;
  const { error } = await db.from('support_sessions').delete().eq('id', id);

  loadSupList();
}

async function makeGradesSummary() {
  const since = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  const { data } = await db.from('grades').select('subject,score').gte('grade_date', since);
  const agg = {};
  (data || []).forEach(g => { agg[g.subject] = agg[g.subject] || [0, 0]; agg[g.subject][0] += Number(g.score); agg[g.subject][1]++; });
  const rows = Object.keys(agg).map(k => `<tr><td>${esc(k)}</td><td>${(agg[k][0] / agg[k][1]).toFixed(2)}</td><td>${agg[k][1]}</td></tr>`).join('');
  const html = `<h3>📈 ملخص النقاط (آخر 30 يوما)</h3>` + (rows
    ? `<table><tr><th>المادة</th><th>المعدل من 20</th><th>عدد النقاط</th></tr>${rows}</table>`
    : '<p>لا توجد نقاط مسجلة في هذه الفترة</p>');
  window._autoTables = (window._autoTables || '') + html;
  if ($('autoTables')) $('autoTables').innerHTML = window._autoTables;
  toast('تم إدراج ملخص النقاط ✅');
}

async function teacherFile(id) {
  const teachers = await teachersList();
  const t = teachers.find(x => x.id === id);
  if (!t) return toast('الأستاذ غير موجود', 'err');
  const m = today().slice(0, 8) + '01';
  const [{ data: tt }, { data: ta }, { data: tp }] = await Promise.all([
    db.from('timetable').select('weekday,period,subject,grp,classes(level,number)').eq('teacher_id', id),
    db.from('teacher_absences').select('absence_date,recorded_by').eq('teacher_id', id).gte('absence_date', m),
    db.from('teachers').select('profile_id').eq('id', id).maybeSingle()
  ]);
  const pid = tp?.profile_id;
  const { data: gr } = pid
    ? await db.from('grades').select('subject,kind,score').eq('recorded_by', pid).gte('grade_date', m)
    : { data: [] };
  const subjects = [...new Set((tt || []).map(x => x.subject).filter(Boolean))];
  const classes = [...new Set((tt || []).map(x => x.classes ? classLabel(x.classes) : '').filter(Boolean))];
  const avg = (gr || []).length ? ((gr || []).reduce((n, g) => n + Number(g.score), 0) / gr.length).toFixed(2) : '-';
  showModal(`🧑‍🏫 ملف الأستاذ — ${esc(t.full_name)}`, `
    <div class="stats-mini">
      <div class="mini s1b">حصص أسبوعية<b>${(tt || []).length}</b></div>
      <div class="mini s4b">غياب هذا الشهر<b>${(ta || []).length}</b></div>
      <div class="mini s2b">نقاط أدخلها<b>${(gr || []).length}</b></div>
      <div class="mini s3b">معدل ما أدخله<b>${avg}</b></div>
    </div>
    <p><b>المواد:</b> ${esc(subjects.join('، ') || '—')}</p>
    <p><b>الأقسام:</b> ${esc(classes.join('، ') || '—')}</p>
    <p class="muted">${pid ? 'حساب مربوط بهذا السجل' : 'هذا الأستاذ بدون حساب دخول، لذلك لا تظهر نقاطه'}</p>`);
}

async function loadGrades() {
  const cid = $('gcls').value, sub = $('gsub').value, kind = $('gkind').value, dt = $('gdt').value;

    ids.length ? db.from('grades').select('student_id,score').eq('subject', sub).in('student_id', ids) : Promise.resolve({ data: [] })
  ]);

  (gr || []).forEach(g => { cur[g.student_id] = g.score; by[g.student_id] = g.recorded_by; });
  const agg = {};
  (all || []).forEach(g => { agg[g.student_id] = agg[g.student_id] || [0, 0]; agg[g.student_id][0] += Number(g.score); agg[g.student_id][1]++; });

}

async function exportCsv() {
  const dt = $('dt') ? $('dt').value : today();
  const [{ data }, cls] = await Promise.all([
    db.from('student_absences').select('absence_date,period,class_id,status,excuse,recorded_by,students(full_name)').eq('absence_date', dt),
    classesList()
  ]);
  const rows = [['التاريخ','القسم','الفترة','التلميذ','الحالة','التبرير','المسجل']].concat((data || []).map(a => {
    const c = cls.find(x => x.id === a.class_id);
    return [a.absence_date, c ? classLabel(c) : '', periodLabel(a.period), a.students?.full_name || '', a.status || '', a.excuse || '', getUserLabel(a.recorded_by)];
  }));
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `غيابات-${dt}.csv`; a.click();
  URL.revokeObjectURL(url);
}

    const per = [...tr.querySelectorAll('.tp:checked')].map(c => Number(c.value));
    const reason = tr.querySelector('.treason').value.trim();
    if (per.length || reason) up.push({ school_id: profile.school_id, teacher_id: id, absence_date: dt, periods: per, reason: reason || null, recorded_by: me.id });
    else if (window._tabRec[id]) del.push(id);
  });
  if (up.length) {
    const { error } = await db.from('teacher_absences').upsert(up, { onConflict: 'teacher_id,absence_date' });
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  for (const id of del) await db.from('teacher_absences').delete().eq('teacher_id', id).eq('absence_date', dt);
  toast(`تم حفظ غيابات الأساتذة باسم: ${profile.full_name} ✅`);
  loadTAbs();
}

async function loadDaily() {
  const dt = $('dt').value;
  const [cls, { data: ab }, { data: nt }] = await Promise.all([
    classesList(),
    db.from('student_absences').select('period,class_id,status,students(full_name)').eq('absence_date', dt),
    db.from('daily_notes').select('class_id,note').eq('note_date', dt)
  ]);
  if (!cls.length) return $('sheet').innerHTML = empty('🏫', 'لا توجد أقسام. أنشئها من صفحة الأقسام.');
  window._dNotes = {};
  (nt || []).forEach(n => window._dNotes[n.class_id] = n.note);
  const map = {};
  (ab || []).forEach(a => {
    const k = a.class_id + '-' + a.period;
    (map[k] = map[k] || []).push((a.students?.full_name || '') + (a.status === 'متأخر' ? ' (م)' : ''));
  });
  let h = `<h2 class="print-only">الورقة الجوالة - ${esc(dt)}</h2>
  <table class="sheet">
    <tr><th rowspan="2">القسم</th>
      <th colspan="4" class="grp">الفترة الصباحية</th>
      <th colspan="3" class="grp">الفترة المسائية</th>
      <th rowspan="2">ملاحظات</th></tr>
    <tr>${PERIODS.map(p => `<th>${p[1]}</th>`).join('')}</tr>`;
  cls.forEach(c => {
    h += `<tr><td><b>${classLabel(c)}</b></td>` + PERIODS.map(p => {
      const n = map[c.id + '-' + p[0]] || [];
      return `<td class="slot" title="اضغط للتعديل" onclick="goRecord('${c.id}',${p[0]})">${n.length ? n.map(esc).join('، ') : '-'}</td>`;
    }).join('') + `<td><input class="dnote" value="${esc(window._dNotes[c.id] || '')}" placeholder="ملاحظة" onchange="saveDailyNote('${c.id}',this.value)"></td></tr>`;
  });
  const tot = PERIODS.map(p => cls.reduce((n, c) => n + (map[c.id + '-' + p[0]] || []).length, 0));
  h += `<tr><td><b>المجموع</b></td>${tot.map(t => `<td><b>${t}</b></td>`).join('')}<td></td></tr>`;
  $('sheet').innerHTML = h + '</table>';
}

// ---------- إصلاح النص المشوه (مثل: â€” أو Ø§) وترجمة تفاصيل سجل النشاط ----------
function fixMojibake(s) {
  if (!s || !/[ÃÂâØÙ]/.test(s)) return s;
  const CP = {'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
  const bytes = [];
  for (const ch of s) {
    const c = ch.charCodeAt(0);
    if (CP[ch] !== undefined) bytes.push(CP[ch]);
    else if (c <= 255) bytes.push(c);
    else return s;
  }
  try { return new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(bytes)); }
  catch (e) { return s; }
}

function activityText(a) {
  const s = fixMojibake(a.summary || '');
  const p = s.split('|');
  const rest = p.slice(1);
  switch (p[0]) {
    case 'absence': return `تسجيل ${p[5] || 'غياب'} للتلميذ ${p[1]} — الفترة ${p[2]} بتاريخ ${p[3]}${p[4] && p[4] !== 'غائب' ? ' — الحالة: ' + p[4] : ''}${p[5] && p[5] !== 'بدون تبرير' ? ' — التبرير: ' + p[5] : ''}`;
    case 'teacher_absence': return `تسجيل غياب الأستاذ ${p[1]} بتاريخ ${p[2]}${p[3] ? ' — السبب: ' + p[3] : ''}`;
    case 'grade': return `إدخال نقطة ${p[2]}/20 للتلميذ ${p[1]} — ${p[3]} (${p[4]})`;
    case 'report': return `حفظ تقرير المستشار بتاريخ ${p[1]}`;
    case 'support': return `تسجيل ${p[1]} في ${p[2]} بتاريخ ${p[3]}`;
    case 'note': return `كتابة ملاحظة على التلميذ ${p[1]}: ${rest.slice(1).join('|')}`;
    case 'exit': return `تسجيل خروج استثنائي للتلميذ ${p[1]} بتاريخ ${p[2]} الساعة ${p[3] || '—'}${p[4] ? ' — السبب: ' + p[4] : ''}`;
    case 'archive': return `حفظ وثيقة في العلبة: ${rest.join('|')}`;
    case 'student': return `تسجيل التلميذ ${rest.join('|')}`;
    case 'teacher': return `تسجيل الأستاذ ${rest.join('|')}`;
    case 'timetable': return `تعديل حصة ${p[1]} — اليوم ${p[2]} — الفترة ${p[3]}`;
    case 'supervisor': return `تسجيل المشرف ${rest.join('|')}`;
    case 'scope': return 'تعديل نطاق إشراف لأحد المشرفين';
    case 'class': return `تعديل القسم ${p[1]} — ${p[2]}`;
    case 'account': return `تعديل حساب ${p[1]} — الصفة: ${p[2]}`;
    default: return s;
  }
}

const EXIT_RELS = ['أب', 'أم', 'ولي شرعي', 'عم', 'خال', 'جد', 'جدة', 'أخرى'];
const EXIT_REASONS = ['مرض', 'موعد طبي', 'ظرف عائلي', 'استدعاء رسمي', 'مرافقة الولي', 'مناسبة عائلية', 'أخرى'];

async function viewExits() {

function exStudentsFor(cid) {

}

function exRowHTML(r, idx) {
  const cid = $('exCls') ? $('exCls').value : '';
  const sid = r ? r.student_id : '';
  const st = (window._exStu || []).find(x => x.id === sid);
  const parent = r ? (r.parent_name || '') : (st?.parent_name || '');
  const rel = r ? (r.parent_relation || '') : (st?.parent_relation || '');

    <td><select class="exStu" onchange="exFillRow(this)" style="min-width:170px"><option value="">— اختر التلميذ —</option>
      ${exStudentsFor(cid).map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.full_name)}</option>`).join('')}</select></td>
    <td class="exCls">${st?.classes ? esc(classLabel(st.classes)) : '—'}</td>
    <td><input type="date" class="exDate" value="${esc(r?.exit_date || $('exDate').value)}"></td>
    <td><input type="time" class="exTime" value="${esc(r?.exit_time || '')}"></td>
    <td><input class="exParent" value="${esc(parent)}" style="min-width:140px"></td>
    <td><select class="exRel">${EXIT_RELS.map(x => `<option ${x === rel ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
    <td style="min-width:90px"></td>
    <td><input class="exId" value="${esc(r?.id_card || '')}" style="min-width:120px"></td>
    <td><input class="exReason" list="dlExReasons" value="${esc(r?.reason || '')}" placeholder="اختر أو اكتب" style="min-width:130px"></td>
    <td><input class="exNote" value="${esc(r?.note || '')}" style="min-width:130px"></td>
    <td class="no-print"><button class="btn small red" onclick="delExitRow(this)">حذف</button></td>
  </tr>`;
}

function exFillRow(sel) {
  const tr = sel.closest('tr');
  const st = (window._exStu || []).find(x => x.id === sel.value);
  tr.querySelector('.exCls').textContent = st?.classes ? classLabel(st.classes) : '—';
  tr.querySelector('.exParent').value = st?.parent_name || '';
  const rel = tr.querySelector('.exRel');
  if (st?.parent_relation) [...rel.options].forEach(o => o.selected = o.text === st.parent_relation);
}

async function loadExits() {
  const dt = $('exDate').value;
  const cid = $('exCls').value;
  const { data, error } = await db.from('exit_log').select('*').eq('exit_date', dt).order('created_at');
  if (error) return $('exTable').innerHTML = errBox(error.message);
  const rows = (data || []).filter(r => !cid || (window._exStu.find(s => s.id === r.student_id)?.class_id === cid));
  window._exDeleted = [];
  const list = rows.length ? rows : [null, null, null];
  $('exTable').innerHTML = `<table class="exTbl">
    <tr><th>الرقم</th><th>اسم التلميذ</th><th>القسم</th><th>التاريخ</th><th>التوقيت</th><th>اسم الولي</th><th>صلة القرابة</th><th>التوقيع</th><th>رقم بطاقة التعريف</th><th>سبب الخروج</th><th>ملاحظات</th><th class="no-print"></th></tr>
    <tbody id="exBody">${list.map((r, i) => exRowHTML(r, i + 1)).join('')}</tbody></table>`;
  renumber();
}

function renumber() {
  [...document.querySelectorAll('#exBody tr')].forEach((tr, i) => tr.firstElementChild.textContent = i + 1);
}

function addExitRow() {
  const tb = $('exBody');
  if (!tb) return;
  tb.insertAdjacentHTML('beforeend', exRowHTML(null, tb.children.length + 1));
  renumber();
}

function delExitRow(btn) {
  const tr = btn.closest('tr');
  if (tr.dataset.id) window._exDeleted.push(tr.dataset.id);
  tr.remove();
  renumber();
}

async function saveExits() {
  const dt = $('exDate').value;
  const ins = [], upd = [];
  for (const tr of document.querySelectorAll('#exBody tr')) {
    const sid = tr.querySelector('.exStu').value;
    if (!sid) continue;
    const st = (window._exStu || []).find(x => x.id === sid);
    const row = {
      school_id: profile.school_id, student_id: sid, class_id: st?.class_id || null,
      exit_date: tr.querySelector('.exDate').value || dt, exit_time: tr.querySelector('.exTime').value || null,
      parent_name: tr.querySelector('.exParent').value.trim() || null,
      parent_relation: tr.querySelector('.exRel').value || null,
      id_card: tr.querySelector('.exId').value.trim() || null,
      reason: tr.querySelector('.exReason').value.trim() || null,
      note: tr.querySelector('.exNote').value.trim() || null,
      recorded_by: me.id
    };
    if (tr.dataset.id) upd.push({ id: tr.dataset.id, row }); else ins.push(row);
  }
  if (!ins.length && !upd.length && !window._exDeleted.length) return toast('لا توجد صفوف للحفظ', 'err');
  if (ins.length) {
    const { error } = await db.from('exit_log').insert(ins);
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  for (const u of upd) {
    const { error } = await db.from('exit_log').update(u.row).eq('id', u.id);
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  for (const id of window._exDeleted) await db.from('exit_log').delete().eq('id', id);
  toast(`تم حفظ سجل الخروج باسم: ${profile.full_name} ✅`);
  loadExits();
}

async function loadPersAlert() {

  (data || []).forEach(a => cnt[a.personnel_id] = (cnt[a.personnel_id] || 0) + 1);
  const bad = (window._pers || []).filter(p => (cnt[p.id] || 0) > 3);

async function savePersAbs() {
  const dt = today();
  const up = [], del = [];
  document.querySelectorAll('#persTbl tr[data-pid]').forEach(tr => {
    const pid = tr.dataset.pid;
    const status = tr.querySelector('.pst').value;
    const excuse = tr.querySelector('.pex').value.trim() || null;
    if (status !== 'present') up.push({ school_id: profile.school_id, personnel_id: pid, absence_date: dt, status, excuse, recorded_by: me.id });
    else if (tr.dataset.saved === '1') del.push(pid);
  });
  if (up.length) {
    const { error } = await db.from('absences_personnel').upsert(up, { onConflict: 'personnel_id,absence_date' });
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  for (const pid of del) await db.from('absences_personnel').delete().eq('personnel_id', pid).eq('absence_date', dt);
  toast(`تم حفظ غياب اليوم باسم: ${profile.full_name} ✅`);
  viewPersonnel();
}

function offHeader(title, o) {

function offTable(headers, rows) {

    ? rows.map(r => `<tr>${r.map(c => `<td>${esc(c ?? '')}</td>`).join('')}</tr>`).join('')

async function offData(dt) {
  const [st, sa, tab, pl, pab, ct, ex, exits, ss] = await Promise.all([
    db.from('students').select('id,full_name,classes(level,number)'),
    db.from('student_absences').select('student_id,period,status,excuse,signature,signed_by_name,signed_at,students(full_name),classes(level,number)').eq('absence_date', dt),
    db.from('teacher_absences').select('periods,reason,teachers(full_name)').eq('absence_date', dt),
    db.from('personnel').select('*').order('full_name'),
    db.from('absences_personnel').select('*').eq('absence_date', dt),
    db.from('cahier_textes').select('status,subject,pages_checked,note,classes(level,number),teachers(full_name)').eq('check_date', dt),
    db.from('exam_calendar').select('exam_date,subject,kind,classes(level,number)').gte('exam_date', dt).lte('exam_date', addDays(dt, 7)).order('exam_date'),
    db.from('exit_log').select('exit_time,reason,students(full_name)').eq('exit_date', dt),
    db.from('session_signatures').select('class_id,period,signature,signed_by_name,signed_at,classes(level,number)').eq('absence_date', dt)
  ]);
  const pabMap = {};
  (pab.data || []).forEach(a => pabMap[a.personnel_id] = a);
  return {
    students: st.data || [], sabs: sa.data || [], tabs: tab.data || [], pers: pl.data || [], pab: pabMap,
    cahier: ct.data || [], exams: ex.data || [], exits: exits.data || [], sess: ss.data || []
  };
}

function addDays(dt, n) { const d = new Date(dt + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

function persRows(list, pab) {
  return list.map(p => {
    const a = pab[p.id];
    return [p.full_name, p.grade || '', maslahaLabel(p.maslaha), a ? (a.status === 'late' ? 'متأخر' : 'غائب') : 'حاضر', a?.excuse || ''];
  });
}

function studentTables(d) {
  const total = d.students.length;
  const absIds = new Set(d.sabs.filter(a => a.status !== 'متأخر').map(a => a.student_id));
  const lateIds = new Set(d.sabs.filter(a => a.status === 'متأخر').map(a => a.student_id));
  const present = total - absIds.size;
  const rate = total ? Math.round(present / total * 100) : 0;
  const stats = offTable(['عدد التلاميذ', 'الحاضرون', 'الغائبون', 'المتأخرون', 'نسبة الحضور %'],
    [[total, present, absIds.size, lateIds.size, rate]]);
  const list = offTable(['التلميذ', 'القسم', 'الفترة', 'التبرير'],
    d.sabs.filter(a => a.status !== 'متأخر').map(a => [a.students?.full_name || '', a.classes ? classLabel(a.classes) : '', periodLabel(a.period), a.excuse || '']));
  return stats + list;
}

  if (type === 'counselor') {

  } else {
    body += `<h4>أولا: التلاميذ</h4>${studentTables(d)}${offNote(n.t1)}`;
    const tRows = d.tabs.map(t => {
      const per = t.periods || [];
      return [t.teachers?.full_name || '', per.length, t.reason || ''];
    });
    const lost = d.tabs.reduce((s, t) => s + (t.periods || []).length, 0);
    body += `<h4>ثانيا: الأساتذة (ساعات ضائعة: ${lost})</h4>${offTable(['الأستاذ', 'عدد الحصص الضائعة', 'السبب'], tRows)}${offNote(n.t2)}`;
    body += `<h4>ثالثا: المشرفون (المداومة والحركة)</h4>${offTable(['الاسم واللقب', 'الرتبة', 'المصلحة', 'الحالة', 'التبرير'], sups)}${offNote(n.t3)}`;
    body += `<h4>رابعا: الموظفون والإداريون التابعون للبيداغوجيا</h4>${offTable(['الاسم واللقب', 'الرتبة', 'المصلحة', 'الحالة', 'التبرير'], adm)}${offNote(n.t4)}`;
    const cRows = d.cahier.map(c => [c.classes ? classLabel(c.classes) : '', c.teachers?.full_name || '', c.subject || '', c.pages_checked || '', c.status === 'ok' ? 'مطابق' : (c.status === 'incomplete' ? 'ناقص' : 'غير موجود'), c.note || '']);
    const eRows = d.exams.map(e => [e.exam_date, e.classes ? classLabel(e.classes) : '', e.subject, e.kind === 'exam' ? 'اختبار' : 'فرض']);
    body += `<h4>خامسا: دفاتر النصوص المراقبة</h4>${offTable(['القسم', 'الأستاذ', 'المادة', 'الصفحات', 'الحالة', 'ملاحظة'], cRows)}`;
    body += `<h4>رزنامة الفروض والاختبارات (7 أيام)</h4>${offTable(['التاريخ', 'القسم', 'المادة', 'النوع'], eRows)}${offNote(n.t5)}`;
  }
  return OFF_CSS + `<div class="off">${offHeader(title, o)}${body}${offSig()}</div>`;
}

function offNotesFields(type) {
  const labels = type === 'counselor'
    ? [['t1', 'ملاحظات وضعية التلاميذ'], ['t2', 'ملاحظات المشرفين'], ['t3', 'ملاحظات الموظفين'], ['t4', 'الأحداث والمداومات']]
    : [['t1', 'ملاحظات التلاميذ'], ['t2', 'ملاحظات الأساتذة'], ['t3', 'ملاحظات المشرفين'], ['t4', 'ملاحظات الموظفين'], ['t5', 'دفاتر النصوص والفروض']];
  return labels.map(([k, l]) => `<label>${l}<textarea class="offn" data-k="${k}" rows="2"></textarea></label>`).join('');
}

function openOfficialReport() {
  const today0 = today();
  showModal('📄 التقرير الرسمي للطبع', `
    <div class="grid2">
      <label>نوع التقرير<select id="ofType" onchange="$('ofNotes').innerHTML=offNotesFields(this.value)">
        <option value="counselor">تقرير مستشار التربية</option><option value="nazir">تقرير الناظر</option></select></label>
      <label>التاريخ<input type="date" id="ofDate" value="${today0}"></label>
      <label>الولاية<input id="ofWilaya" placeholder="مثال: بشار"></label>
      <label>السنة الدراسية<input id="ofYear" value="2025/2026"></label>
      <label style="grid-column:1/-1">المؤسسة<input id="ofSchool" value="${esc(schoolName || '')}"></label>
    </div>
    <div id="ofNotes" class="grid2" style="margin-top:8px">${offNotesFields('counselor')}</div>
    <div class="toolbar"><button class="btn green" onclick="printOfficial()">🖨️ معاينة وطباعة رسمية</button>
      <p class="muted">الجداول تُعبَّأ تلقائيا من التطبيق. اكتب الملاحظات فقط.</p></div>
    <h3>✏️ تسجيل دفتر نص مراقب</h3>
    <div class="grid2">
      <select id="ctCls">${(window._cls || []).map(c => `<option value="${c.id}">${classLabel(c)}</option>`).join('')}</select>
      <input id="ctSub" list="dlSubjects" placeholder="المادة">
      <input id="ctPages" placeholder="الصفحات المراقبة">
      <select id="ctStatus"><option value="ok">مطابق</option><option value="incomplete">ناقص</option><option value="missing">غير موجود</option></select>
      <input id="ctNote" placeholder="ملاحظة" style="grid-column:1/-1">
      <button class="btn small" style="grid-column:1/-1" onclick="saveCahier()">💾 حفظ الدفتر باسمك</button>
    </div>
    <h3>📅 تسجيل فرض أو اختبار</h3>
    <div class="grid2">
      <select id="exCls2">${(window._cls || []).map(c => `<option value="${c.id}">${classLabel(c)}</option>`).join('')}</select>
      <input id="exSub" list="dlSubjects" placeholder="المادة">
      <input type="date" id="exDt2" value="${today0}">
      <select id="exKind"><option value="test">فرض</option><option value="exam">اختبار</option></select>
      <button class="btn small" style="grid-column:1/-1" onclick="saveExam()">💾 حفظ في الرزنامة</button>
    </div>`);
  $('ofType') && $('ofType').dispatchEvent(new Event('change'));
}

async function printOfficial() {
  const type = $('ofType').value, dt = $('ofDate').value;
  const notes = {};
  document.querySelectorAll('.offn').forEach(t => notes[t.dataset.k] = t.value.trim());
  const o = { wilaya: $('ofWilaya').value.trim(), year: $('ofYear').value.trim(), school: $('ofSchool').value.trim(),
    date: dt, kindLabel: type === 'counselor' ? 'مستشار التربية' : 'الناظر', notes };
  const html = await buildOfficial(type, dt, o);
  const title = type === 'counselor' ? 'تقرير مستشار التربية' : 'تقرير الناظر';
  openPrint(title, html, true);
}

async function saveCahier() {
  const { error } = await db.from('cahier_textes').insert({
    school_id: profile.school_id, class_id: $('ctCls').value, subject: $('ctSub').value.trim() || null,
    pages_checked: $('ctPages').value.trim() || null, status: $('ctStatus').value, note: $('ctNote').value.trim() || null,
    check_date: today(), recorded_by: me.id
  });
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تم حفظ دفتر النص ✅');
}

async function saveExam() {
  const { error } = await db.from('exam_calendar').insert({
    school_id: profile.school_id, class_id: $('exCls2').value, subject: $('exSub').value.trim(),
    exam_date: $('exDt2').value, kind: $('exKind').value, created_by: me.id
  });
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تمت الإضافة إلى الرزنامة ✅');
}

  else if (role) names = Object.values(userProfilesMap || {}).filter(p => p.role === role).map(p => p.full_name);
  $('dlWho').innerHTML = [...new Set(names)].map(n => `<option value="${esc(n)}">`).join('');

function meetFill(name) {
  const st = window._meetStu.find(s => s.full_name === name);

  $('mCls').value = st?.classes ? classLabel(st.classes) : '';

async function saveMeeting(e) {
  e.preventDefault();
  const name = $('mStu').value.trim();
  const st = window._meetStu.find(s => s.full_name === name);
  const parts = name.split(/\s+/);
  const row = {
    school_id: profile.school_id, date_rencontre: $('mD').value, heure_rencontre: $('mH').value,
    student_id: st?.id || null, nom_eleve: parts[0], prenom_eleve: parts.slice(1).join(' ') || '-',
    classe: $('mCls').value || '-', nom_parent: $('mPar').value.trim() || null,
    professeur_id: $('mTh').value || null, matiere: $('mSub').value.trim() || null,
    type_rencontre: $('mType').value, lieu: $('mPlace').value.trim() || 'مكتب الاستشارة',
    observations: $('mObs').value.trim() || null, decisions: $('mDec').value.trim() || null,
    statut: 'planned', created_by: String(me.id), maslaha: profile.maslaha || null,
    participant_role: $('mWho') ? ($('mWho').value || null) : null, participant_name: $('mWhoName') ? ($('mWhoName').value.trim() || null) : null
  };
  const { error } = await db.from('rencontres_parents').insert(row);
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تم حفظ اللقاء وسيظهر لولي الأمر ✅');
  viewMeetings();
}

// ---------- الدخول والتسجيل باسم المستخدم (البريد اختياري) ----------
const UNAME_RE = /^[a-z0-9._-]{3,30}$/;
const internalEmail = u => u + '@users.tifoun.app';

function identEmail(id) {
  const hex = [...new TextEncoder().encode(id.trim().toLowerCase())].map(b => b.toString(16).padStart(2, '0')).join('');
  return 'id' + hex + '@users.tifoun.app';
}

function accountEmail(id) {
  const u = id.trim().toLowerCase();
  return UNAME_RE.test(u) ? internalEmail(u) : identEmail(u);
}

async function login(e) {
  e.preventDefault();
  const chosen = $('lrole').value;
  const raw = $('em').value.trim();
  const email = raw.includes('@') ? raw : accountEmail(raw);
  const { data, error } = await db.auth.signInWithPassword({ email, password: $('pw').value });
  if (error) return toast('خطأ: اسم المستخدم أو كلمة المرور غير صحيحة', 'err');
  const { data: p } = await db.from('profiles').select('role,requested_role').eq('id', data.user.id).single();
  const actual = p ? (p.role === 'pending' ? p.requested_role : p.role) : null;
  if (actual !== chosen) {
    await db.auth.signOut();
    return toast(`هذا الحساب صفته: ${ROLE_LABEL[actual] || 'غير محددة'}. اختر الصفة الصحيحة.`, 'err');
  }
  boot();
}

async function signup(e) {
  e.preventDefault();
  if ($('sp').value !== $('sp2').value) return toast('كلمتا المرور غير متطابقتين', 'err');
  const mail = $('sx').value.trim().toLowerCase();
  const isDir = $('rr').value === 'directeur';
  if ($('rr').value === 'enseignant' && !$('ssb').value) return toast('اختر المادة التي يدرسها الأستاذ', 'err');
  if (isDir && !mail.includes('@')) return toast('المدير يجب أن يدخل بريدا إلكترونيا', 'err');
  if (mail && !mail.includes('@')) return toast('البريد الإلكتروني غير صحيح', 'err');
  const given = $('se').value.trim().toLowerCase();
  const ident = given || $('fn').value.trim().toLowerCase();
  if (!ident) return toast('أدخل الاسم الكامل', 'err');
  const uname = ident;
  const codeIn = $('sc').value.trim();
  let schoolId = '';
  if (codeIn) {
    if (/^[0-9a-f-]{36}$/i.test(codeIn)) schoolId = codeIn;
    else {
      const { data: sid } = await db.rpc('school_id_by_code', { p_code: codeIn });
      if (!sid) return toast('المعرّف غير صحيح، تحقق منه مع المدير', 'err');
      schoolId = sid;
    }
  }
  const { data, error } = await db.auth.signUp({
    email: mail || accountEmail(ident), password: $('sp').value,
    options: { data: { full_name: $('fn').value, school_id: schoolId, requested_role: $('rr').value,
      maslaha: $('rm').value, username: uname } }
  });
  if (error) return toast('خطأ: ' + (error.message.includes('already') ? 'اسم المستخدم مستعمل من قبل' : error.message), 'err');
  if (data?.session) {
    await db.rpc('set_profile_extra', { p_username: UNAME_RE.test(uname) ? uname : null, p_maslaha: $('rm').value, p_contact_email: $('sx').value.trim() || null, p_subject: $('rr').value === 'enseignant' ? ($('ssb').value || null) : null });
    await db.auth.signOut();
  }
  if (mail) toast('تم إنشاء الحساب. انتظر موافقة المدير ليفتح لك صلاحياتك.');
  else showModal('✅ تم إنشاء الحساب', `<p>احفظ هذا المعرّف للدخول (اسم المستخدم أو الاسم الكامل):</p><h2 style="text-align:center">${esc(ident)}</h2><p class="muted">انتظر موافقة المدير ليفتح لك صلاحياتك.</p>`);
  loginView();
}

function docClone() {
  const src = document.getElementById('ddBody');
  const clone = src.cloneNode(true);
  clone.querySelectorAll('input[type=checkbox]').forEach(c => { const s = document.createElement('span'); s.textContent = c.checked ? '☑' : '☐'; c.replaceWith(s); });
  clone.querySelectorAll('select').forEach(x => { const s = document.createElement('span'); s.textContent = x.value === '__c' ? (x.nextElementSibling?.value || '') : (x.value ? x.options[x.selectedIndex].text : ''); x.replaceWith(s); });
  clone.querySelectorAll('input').forEach(i => { const s = document.createElement('span'); s.textContent = i.value || ''; i.replaceWith(s); });
  clone.querySelectorAll('textarea').forEach(t => { const d = document.createElement('div'); d.style.whiteSpace = 'pre-wrap'; d.textContent = t.value; t.replaceWith(d); });
  clone.querySelectorAll('.no-print').forEach(e => e.remove());
  return clone.outerHTML;
}

async function saveStaffRow(el) {
  const tr = el.closest('tr');
  const kind = tr.dataset.kind;
  const name = tr.querySelector('.sname').value.trim();
  const grade = tr.querySelector('.sgrade').value || null;
  const st = tr.querySelector('.sst').value;
  const ex = tr.querySelector('.sex').value.trim() || null;
  const dt = (document.getElementById('ddDt') || {}).value || today();
  if (!name) return;
  let p = (window._pers || []).find(x => x.full_name.trim() === name &&
    (kind === 'supervisor' ? x.category === 'supervisor' : x.category !== 'supervisor'));
  if (!p) {
    const { data, error } = await db.from('personnel').insert({
      school_id: profile.school_id, full_name: name, category: kind, grade, maslaha: 'general_admin'
    }).select().single();
    if (error) return toast('تعذر إنشاء السجل: ' + error.message, 'err');
    p = data;
    window._pers = [...(window._pers || []), p];
  } else if (grade && p.grade !== grade) {
    await db.from('personnel').update({ grade }).eq('id', p.id);
    p.grade = grade;
  }
  if (st === 'present') {
    const { error } = await db.from('absences_personnel').delete().eq('personnel_id', p.id).eq('absence_date', dt);
    if (error) return toast('خطأ: ' + error.message, 'err');
  } else {
    const { error } = await db.from('absences_personnel').upsert({
      school_id: profile.school_id, personnel_id: p.id, absence_date: dt, status: st, excuse: ex, recorded_by: me.id
    }, { onConflict: 'personnel_id,absence_date' });
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  toast(`تم حفظ ${name} باسم: ${profile.full_name} ✅`);
}

    db.from('grades').select('subject,kind,score,grade_date').eq('student_id', sid).order('grade_date', { ascending: false }),
    db.from('support_sessions').select('kind,subject,session_date,hours,teacher_name,supervisor_name').contains('attendees', [sid]).order('session_date', { ascending: false }),

async function addTeacher(e) {
  e.preventDefault();
  if (!$('ts2').value) return toast('اختر المادة التي يدرسها الأستاذ', 'err');
  const name = [$('tln').value, $('tfn').value].map(x => x.trim()).filter(Boolean).join(' ');
  const { data: id, error } = await db.rpc('add_teacher', { p_name: name, p_subject: $('ts2').value.trim() || '', p_phone: $('tp').value.trim() || '' });
  if (error) return toast('خطأ: ' + error.message, 'err');
  const extra = {
    email: $('te').value.trim() || null, address: $('tad').value.trim() || null, degree: $('tdg').value.trim() || null,
    tenure_status: $('tts').value || null, tenure_year: $('tty').value ? Number($('tty').value) : null
  };
  if (id && Object.values(extra).some(v => v !== null)) {
    const { error: e2 } = await db.from('teachers').update(extra).eq('id', id);
    if (e2) toast('تم إضافة الأستاذ، لكن تعذر حفظ بياناته الإضافية: ' + e2.message, 'err');
  }
  toast('تمت إضافة الأستاذ ✅');
  viewTeachers();
}

function numberTablesForPrint(root) {
  root.querySelectorAll('table').forEach(t => {
    const rows = [...t.rows];
    if (rows.length < 2) return;
    const hdr = rows[0];
    if (hdr.cells[0] && /الرقم|^#$/.test(hdr.cells[0].textContent.trim())) return;
    const th = document.createElement('th');
    th.textContent = 'الرقم';
    hdr.insertBefore(th, hdr.firstChild);
    let n = 0;
    rows.slice(1).forEach(r => {
      const td = document.createElement('td');
      if (r.cells.length === 1 && r.cells[0].colSpan > 1) { td.textContent = ''; }
      else td.textContent = ++n;
      r.insertBefore(td, r.firstChild);
    });
  });
}

async function saveSlot() {
  const sub = $('sb_sub').value;
  const full = FULL_ROLES.includes(profile.role);
  const tid = full ? $('sb_t').value : window._myTeacherId;
  if (!sub) return toast('اختر المادة', 'err');
  if (!tid) return toast('اختر الأستاذ المكلف', 'err');
  const base = {
    school_id: profile.school_id, class_id: window._ttCls, grp: Number($('sb_grp').value),
    weekday: Number($('sb_day').value), subject: sub, teacher_id: tid, room: roomValue()
  };
  const p1 = Number($('sb_per').value);
  const periods = [p1];
  if ($('sb_double') && $('sb_double').checked) {
    const p2 = p1 + 1;
    if (!PERIODS.some(p => p[0] === p2) || (p1 === 4) || (p1 === 7)) return toast('الحصة المزدوجة تحتاج فترة متتالية في نفس الفترة اليومية', 'err');
    periods.push(p2);
  }
  for (const p of periods) {
    const { error } = await db.from('timetable').upsert({ ...base, period: p }, { onConflict: 'class_id,grp,weekday,period' });
    if (error) return toast('خطأ: ' + error.message, 'err');
  }
  closeSlot();
  toast(periods.length > 1 ? 'تمت إضافة حصتين متتاليتين ✅' : 'تمت إضافة الحصة ✅');
  loadTimetable();
}

async function coordinatorsBlock() {
  const canEdit = ['directeur', 'conseiller'].includes(profile.role);
  const [{ data: rows }, { data: tl }, cls] = await Promise.all([
    db.from('teacher_coordinators').select('*').order('created_at'),

  const dlC = `<datalist id="dlCoC">${cls.map(c => `<option value="${esc(classLabel(c))}">`).join('')}</datalist>`;
  const dlS = `<datalist id="dlCoS">${SUBJECTS.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  const block = (kind, title, col2, dl2) => {
    const list = window._coordRows.filter(r => r.kind === kind);

      <td><input class="coT" list="dlCoT" value="${esc(r.teacher_name || '')}" ${canEdit ? '' : 'disabled'}></td>
      <td><input class="coX" list="${dl2}" value="${esc(r.target || '')}" ${canEdit ? '' : 'disabled'}></td>
      <td><input class="coN" value="${esc(r.note || '')}" ${canEdit ? '' : 'disabled'}></td>
      ${canEdit ? '<td class="no-print"><button class="btn small red" onclick="this.closest(\'tr\').remove()">حذف</button></td>' : ''}</tr>`).join('');
    return `<h3>${title}</h3>
      <div style="overflow-x:auto"><table class="coTbl" data-kind="${kind}"><tr><th>الرقم</th><th>الأستاذ</th><th>${col2}</th><th>ملاحظة</th>${canEdit ? '<th class="no-print"></th>' : ''}</tr>${rowsHTML || ''}</table></div>
      ${canEdit ? `<div class="toolbar no-print"><button class="btn small" onclick="addCoRow('${kind}','${dl2}')">＋ إضافة سطر</button></div>` : ''}`;
  };
  return `${dlT}${dlC}${dlS}
    <div class="card" style="margin-top:14px">
      <div class="toolbar no-print" style="justify-content:space-between">
        <b>🧭 الأساتذة المنسقون (للمستشار والمدير فقط بالتعديل)</b>
        <button class="btn gray small" onclick="printCoordinators()">🖨️ طباعة الجدولين</button>

      ${block('class', 'منسقو الأقسام', 'القسم', 'dlCoC')}
      ${block('subject', 'منسقو المواد', 'المادة', 'dlCoS')}
      ${canEdit ? '<div class="toolbar no-print"><button class="btn green" onclick="saveCoordinators()">💾 حفظ المنسقين باسمك</button></div>' : ''}
    </div>`;
}

async function loadCoordinators() {
  if (!['directeur', 'conseiller'].includes(profile.role)) return;
  const { data, error } = await db.from('coordinators').select('*').order('created_at');
  if (error) return toast('تعذر تحميل المنسقين: ' + error.message, 'err');
  const rows = data || [];
  const render = (kind, label, listId, boxId) => {
    const box = $(boxId);
    if (!box) return;
    const items = rows.filter(r => r.kind === kind);
    box.innerHTML = `<div class="toolbar no-print">
        <input id="${kind}Name" list="dlTeach" placeholder="اسم الأستاذ (اختر أو اكتب)">
        <input id="${kind}Target" list="${listId}" placeholder="${label} (اختر أو اكتب)">
        <input id="${kind}Note" placeholder="ملاحظة">
        <button class="btn small" onclick="addCoord('${kind}')">＋ إضافة</button>
        <button class="btn red small" onclick="clearCoord('${kind}')">تفريغ الجدول</button></div>
      <table><tr><th>الرقم</th><th>الأستاذ</th><th>${label}</th><th>ملاحظة</th><th class="no-print">حذف</th></tr>
      ${items.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.person_name)}</td><td>${esc(r.target || '')}</td><td>${esc(r.note || '')}</td>
        <td class="no-print"><button class="btn small red" onclick="delCoord('${r.id}')">حذف</button></td></tr>`).join('')
        || '<tr><td colspan="5" class="muted">لا توجد سجلات بعد</td></tr>'}</table>`;
  };
  render('class', 'القسم', 'dlCls', 'ccBox');
  render('subject', 'المادة', 'dlSubj', 'scBox');
}

async function addCoord(kind) {
  const name = $(kind + 'Name').value.trim();
  if (!name) return toast('اكتب اسم الأستاذ أو اختره', 'err');
  const { error } = await db.from('coordinators').insert({
    school_id: profile.school_id, kind, person_name: name,
    target: $(kind + 'Target').value.trim() || null, note: $(kind + 'Note').value.trim() || null, recorded_by: me.id
  });
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تمت الإضافة ✅');
  loadCoordinators();
}

async function delCoord(id) {
  const { error } = await db.from('coordinators').delete().eq('id', id);
  if (error) return toast('خطأ: ' + error.message, 'err');
  loadCoordinators();
}

async function clearCoord(kind) {
  if (!confirm('سيتم حذف كل سجلات هذا الجدول. متابعة؟')) return;
  const { error } = await db.from('coordinators').delete().eq('school_id', profile.school_id).eq('kind', kind);
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تم تفريغ الجدول');
  loadCoordinators();
}

function supFormData() {

function supMessage(when, name, status, kind, subject, date, hours) {
  if (when === 'before') return `السلام عليكم، نعلمكم أن ابنكم ${name} مدعو لحصة ${kind} في مادة ${subject} يوم ${date} على الساعة ${hours || '—'}. شكرا لتعاونكم.`;
  const verb = status === 'absent' ? 'تغيّب ابنكم' : status === 'late' ? 'تأخر ابنكم عن' : 'حضر ابنكم';
  return `السلام عليكم، ${verb} ${name} حصة ${kind} في مادة ${subject} بتاريخ ${date}.`;
}

function supSend(btn, when) {
  const tr = btn.closest('tr');

  const s = (window._stu || []).find(x => x.id === sid);

  if (!s || !s.parent_phone) return toast('لا يوجد هاتف ولي مسجل لهذا التلميذ', 'err');
  const text = supMessage(when, name, tr.querySelector('.sSt').value, $('sk').value, $('ssub').value.trim() || '—', $('sdt').value, $('shrs').value.trim());

    db.from('students').select('id,full_name,parent_id,class_id,classes(level,number)').eq('school_id', profile.school_id).order('full_name')
  ]);
  if (error) return content().innerHTML = errBox(error.message);
  window._stuAll = stu || [];
  const SECTIONS = [
    ['directeur', '👑 المديرون', ['directeur']],
    ['enseignant', '🧑‍🏫 الأساتذة', ['enseignant']],
    ['surveillant', '👮 المشرفون', ['surveillant']],
    ['conseiller', '🧭 المستشارون والنظار', ['conseiller']],
    ['employe', '🗂️ الإداريون والموظفون', ['employe']],
    ['parent', '👨‍👩‍👧 أولياء الأمور', ['parent']]
  ];
  const sectionsHTML = SECTIONS.map(([key, title, roles]) => {

    ${sectionsHTML}`;
}

function accountsSection(key, title, list) {
  const rows = list.map(p => {
    const pending = p.role === 'pending';
    const cur = pending ? p.requested_role : p.role;
    const isMe = p.id === me.id;
    const linked = (window._stuAll || []).find(s => s.parent_id === p.id);
    const parentCell = key === 'parent'
      ? `<input id="pl-${p.id}" list="dlStuAcc" value="${esc(linked ? linked.full_name : '')}" placeholder="ابحث أو اكتب اسم التلميذ">
         <button class="btn small" onclick="linkParentSearch('${p.id}')">ربط</button>`
      : '—';
    const extra = cur === 'employe'
      ? `<select id="m-${p.id}">${MASLAHA.map(m => `<option value="${m[0]}" ${m[0] === p.maslaha ? 'selected' : ''}>${m[1]}</option>`).join('')}</select>`
      : cur === 'enseignant'
        ? `<select id="sj-${p.id}"><option value="">— المادة —</option>${SUBJECTS.map(x => `<option ${x === p.subject ? 'selected' : ''}>${x}</option>`).join('')}</select>`
        : '—';
    const action = pending ? `<button class="btn green small" onclick="setRole('${p.id}','${p.requested_role}')">✅ تأكيد</button>` : '<span class="badge ok">مفعّل</span>';
    const cancel = isMe ? '' : ` <button class="btn red small" onclick="removeAccount('${p.id}')">❌ إلغاء</button>`;
    return `<tr><td>${esc(p.full_name)}</td><td>${esc(p.username || '—')}</td><td>${esc(ROLE_LABEL[cur] || cur)}</td>
      <td>${pending ? '<span class="badge">بانتظار التأكيد</span>' : '<span class="badge ok">مفعّل</span>'}</td>
      <td>${extra}</td><td>${parentCell}</td><td>${action}${cancel}</td></tr>`;
  }).join('');
  return `<div class="card"><h3 style="margin-top:0">${title} (${list.length})</h3>
    <div style="overflow-x:auto"><table><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصفة</th><th>الحالة</th><th>المصلحة / المادة</th><th>ربط بتلميذ</th><th>الإجراء</th></tr>
    ${rows || '<tr><td colspan="7" class="muted">لا يوجد</td></tr>'}</table></div></div>`;
}

async function linkParentSearch(uid) {
  const name = $('pl-' + uid).value.trim();
  await db.from('students').update({ parent_id: null }).eq('parent_id', uid);
  if (!name) { toast('تم فك الربط'); return viewAccounts(); }
  const st = (window._stuAll || []).find(s => s.full_name === name);
  if (!st) return toast('الاسم غير موجود بين التلاميذ', 'err');
  const { error } = await db.from('students').update({ parent_id: uid }).eq('id', st.id);
  if (error) return toast('خطأ: ' + error.message, 'err');
  toast('تم ربط ولي الأمر بالتلميذ ✅');
  viewAccounts();
}

async function viewChild() {
  const { data: kids } = await db.from('students').select('id,full_name,classes(level,number)').eq('parent_id', me.id);
  const ids = (kids || []).map(k => k.id);
  if (!ids.length) return content().innerHTML = empty('👨‍👦', 'لم يُربط حسابك بعد بتلميذ. اطلب من مدير المؤسسة ربطه من صفحة الحسابات');
  const [{ data: ab }, { data: gr }, { data: sp }, { data: nt }] = await Promise.all([
    db.from('student_absences').select('absence_date, period, status, student_id, students(full_name)').in('student_id', ids).order('absence_date', { ascending: false }),
    db.from('grades').select('subject, kind, score, grade_date, student_id, students(full_name)').in('student_id', ids).order('grade_date', { ascending: false }),
    db.from('support_sessions').select('id, kind, subject, session_date, hours, teacher_name, attendees, attendance').order('session_date', { ascending: false }),
    db.from('student_notes').select('author_name, author_role, note, created_at, student_id, students(full_name)').in('student_id', ids).order('created_at', { ascending: false })
  ]);
  const STAT = { present: '✅ لديه دعم / حضر', absent: '❌ غاب عن الدعم', late: '⏰ تأخر', blocked: '🚫 محظور من الدعم' };
  const mine = (sp || []).filter(x => (x.attendees || []).some(a => ids.includes(a)));
  const sTable = mine.length ? mine.map(x => {
    const rows = kids.filter(k => (x.attendees || []).includes(k.id)).map(k => {
      const a = (x.attendance || []).find(y => y.id === k.id);
      return `<tr><td>${esc(x.session_date)}</td><td>${esc(x.hours || '')}</td><td>${esc(x.subject || '')}</td><td>${esc(x.kind)}</td>
        <td>${esc(k.full_name)}</td><td><b>${a ? STAT[a.status] || esc(a.status) : 'لم يُسجَّل بعد'}</b></td></tr>`;
    }).join('');
    return rows;
  }).join('') : '';
  const spHTML = sTable ? `<table><tr><th>التاريخ</th><th>التوقيت</th><th>المادة</th><th>النوع</th><th>التلميذ</th><th>بعد الحصة</th></tr>${sTable}</table>`
    : '<p class="muted">لا توجد حصص استدراك أو دعم لأبنائك</p>';
  const gTable = (gr || []).length ? `<table><tr><th>التاريخ</th><th>التلميذ</th><th>المادة</th><th>النوع</th><th>النقطة</th></tr>${gr.map(g =>
    `<tr><td>${esc(g.grade_date)}</td><td>${esc(g.students?.full_name || '')}</td><td>${esc(g.subject)}</td><td>${esc(g.kind)}</td><td><b>${esc(g.score)}</b>/20</td></tr>`).join('')}</table>` : '<p class="muted">لا توجد نقاط مسجلة</p>';
  const nList = (nt || []).map(n => `<div class="card"><b>${esc(n.students?.full_name || '')}</b> — <span class="badge info">${esc(n.author_role || '')}</span> ${esc(n.author_name || '')}
    <small class="muted">${esc(n.created_at.slice(0, 10))}</small><p style="margin:6px 0 0;white-space:pre-wrap">${esc(n.note)}</p></div>`).join('') || '<p class="muted">لا توجد ملاحظات من المدرسة بعد</p>';
  content().innerHTML = `
    <div class="card"><b>💌 ملاحظات المدرسة لأبنائك</b>${nList}</div>
    <h3>📚 حصص الاستدراك والدعم</h3>${spHTML}
    <h3>📝 نقاط أبنائي</h3>${gTable}
    <h3>🕘 غيابات أبنائي</h3>${(ab || []).map(a =>
      `<div class="row">📅 ${esc(a.absence_date)} — ${esc(periodLabel(a.period))} — ${esc(a.students?.full_name || '')} — ${esc(a.status || 'غائب')}</div>`).join('') || '<p class="muted">لا توجد غيابات مسجلة</p>'}`;
}

function ptChanged(sel) {
  const inp = sel.nextElementSibling;
  if (sel.value === '__c') { inp.style.display = ''; inp.focus(); }
  else { inp.style.display = 'none'; inp.value = ''; }
  // إذا كان الحقل اسم أستاذ: تُملأ المادة تلقائيا في الصف نفسه
  if (sel.dataset.list === 'dlTeach') {
    const name = sel.value === '__c' ? inp.value : sel.value;
    const row = sel.closest('tr');
    const subjSel = row && row.querySelectorAll('.pt-sel')[2];
    if (subjSel) linkSubjectFor(name, subj => { if ([...subjSel.options].some(o => o.value === subj)) subjSel.value = subj; });
  }
}
