function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('تعذر قراءة هذه الصورة، جرّب صورة أخرى')); };
    img.src = url;
  });
}

function fileToBase64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('تعذر قراءة الصورة'));
    r.readAsDataURL(f);
  });
}

function readWorkbookFile(f, cb) {
  const r = new FileReader();
  r.onload = e => {
    const buf = new Uint8Array(e.target.result);
    let wb;
    if (/\.csv$/i.test(f.name)) {
      let txt = new TextDecoder('utf-8').decode(buf);
      if (txt.includes('\uFFFD')) txt = new TextDecoder('windows-1256').decode(buf);
      wb = XLSX.read(txt, { type: 'string' });
    } else {
      wb = XLSX.read(buf, { type: 'array' });
    }
    cb(wb);
  };
  r.readAsArrayBuffer(f);
}

function importStudents(input) {
  const f = input.files[0];
  if (!f) return;
  readWorkbookFile(f, async wb => {
    try {
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blank: '', raw: true });
      const clean = x => String(x ?? '').replace(/\*/g, '').replace(/\s+/g, ' ').trim();
      const hi = grid.findIndex(row => row.some(c => clean(c) === 'اللقب') && row.some(c => clean(c) === 'الاسم'));
      if (hi < 0) return toast('لم أجد عمودي "اللقب" و"الاسم" في الملف. استعمل النموذج', 'err');
      const H = grid[hi].map(clean);
      const find = (...names) => { for (const n of names) { const i = H.findIndex(h => h === n); if (i >= 0) return i; } return H.findIndex(h => names.some(n => h.startsWith(n))); };
      const cLast = find('اللقب'), cFirst = find('الاسم'), cBirth = find('تاريخ الميلاد'), cCls = find('القسم'),
        cReg = find('رقم القيد'), cPar = find('ولي الأمر'), cPhone = find('هاتف الولي', 'الهاتف'), cMail = find('البريد الإلكتروني', 'البريد');
      const clsAll = await classesList();
      const norm = x => String(x).replace(/\s+/g, ' ').trim();
      const allCls = !!($('impAll') && $('impAll').checked);
      const selCid = allCls ? null : selectedClass();
      if (!allCls && !selCid) return;
      const rows = []; const why = {};
      const names = [...new Set(grid.slice(hi + 1).map(r => (cCls >= 0 ? clean(r[cCls]) : '')).filter(Boolean))];
      for (const nm of names) {
        const mm = norm(nm).match(/^(\d+)\s*م\s*(\d+)$/);
        if (!mm) continue;
        if (clsAll.find(c => String(c.level) === mm[1] && String(c.number) === mm[2])) continue;
        const { data: nc, error: ce } = await db.from('classes').insert({ school_id: profile.school_id, level: +mm[1], number: +mm[2] }).select().single();
        if (!ce && nc) clsAll.push(nc);
      }
      grid.slice(hi + 1).forEach(row => {
        const get = i => (i >= 0 && row[i] !== undefined ? clean(row[i]) : '');
        const last = get(cLast), first = get(cFirst);
        if (!last && !first) return;               // سطر فارغ
        const birth = parseExcelDate(cBirth >= 0 ? row[cBirth] : null);
        const clsName = norm(get(cCls));
        const pm = clsName.match(/^(\d+)\s*م\s*(\d+)$/);
        const match = clsAll.find(c => norm(classLabel(c)) === clsName || (pm && String(c.level) === pm[1] && String(c.number) === pm[2]));
        const cid = match ? match.id : selCid;
        const missing = [!last && 'اللقب', !first && 'الاسم', !birth && 'تاريخ الميلاد', !clsName && 'القسم'].filter(Boolean);
        if (missing.length) { missing.forEach(m => why[m] = (why[m] || 0) + 1); return; }
        if (!cid) { why['القسم غير معروف'] = (why['القسم غير معروف'] || 0) + 1; return; }
        rows.push({ school_id: profile.school_id, class_id: cid, full_name: `${last} ${first}`, birth_date: birth,
          reg_no: get(cReg) || regNo(), parent_name: get(cPar) || null, parent_phone: get(cPhone) || null,
          parent_email: get(cMail) || null, address: null });
      });
      const skipped = Object.entries(why).map(([k, v]) => `${k}: ${v}`).join('، ');
      if (!rows.length) return toast('لا يوجد تلاميذ صالحون. ' + (skipped ? 'الأسباب: ' + skipped : ''), 'err');
      if (!confirm(`سيتم إضافة ${rows.length} تلميذ.${skipped ? `\nتخطي بعض الأسطر لأن الحقول الإجبارية ناقصة: ${skipped}` : ''}\nمتابعة؟`)) return;
      for (let i = 0; i < rows.length; i += 100) {
        const { error } = await db.from('students').insert(rows.slice(i, i + 100));
        if (error) return toast('خطأ: ' + error.message, 'err');
      }
      toast(`تمت إضافة ${rows.length} تلميذ ✅`);
      viewStudents();
    } catch (err) { toast('تعذر قراءة الملف: ' + err.message, 'err'); }
  });
}

function askSignature(title) {
  return new Promise(resolve => {
    showModal(title, `<p class="muted">وقّع داخل المربع بالفأرة أو بالإصبع، ثم اضغط تأكيد. سيُسجَّل توقيعك باسم حسابك.</p>
      <canvas id="sigC" width="560" height="200" style="width:100%;max-width:560px;background:#fff;border:2px solid #D4AF37;border-radius:12px;touch-action:none"></canvas>
      <div class="toolbar" style="margin-top:10px"><button class="btn gray small" type="button" onclick="sigClear()">🧹 مسح</button>
        <button class="btn" type="button" onclick="sigOk()">✅ تأكيد التوقيع</button>
        <button class="btn gray small" type="button" onclick="sigCancel()">إلغاء</button></div>`);
    const c = $('sigC'), ctx = c.getContext('2d');
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#101010';
    let drawing = false, has = false;
    const pos = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; };
    c.onpointerdown = e => { drawing = true; has = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); c.setPointerCapture(e.pointerId); };
    c.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    c.onpointerup = () => { drawing = false; };
    window.sigClear = () => { ctx.clearRect(0, 0, c.width, c.height); has = false; };
    window.sigOk = () => {
      if (!has) return toast('وقّع أولا', 'err');
      const url = c.toDataURL('image/png');
      const m = document.getElementById('genModal'); if (m) m.remove();
      resolve(url);
    };
    window.sigCancel = () => { const m = document.getElementById('genModal'); if (m) m.remove(); resolve(null); };
  });
}

function dailyToken(schoolId, dt, seq) {
  const str = schoolId + '|' + dt + '|' + (seq || 0) + '|tifoun'; let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

const DEFAULT_SCHED = { morning: { in: '08:00', in_tol: 15, out_on: false, out: '12:00', out_tol: 15 }, evening: { in: '14:00', in_tol: 15, out_on: false, out: '17:00', out_tol: 15 } };

function schedEvents(cfg) {
  const sch = cfg.schedule || DEFAULT_SCHED;
  const list = [];
  ['morning', 'evening'].forEach(per => {
    const p = Object.assign({}, DEFAULT_SCHED[per], sch[per] || {});
    list.push({ period: per, kind: 'in', at: p.in, tol: Number(p.in_tol || 0) });
    if (p.out_on) list.push({ period: per, kind: 'out', at: p.out, tol: Number(p.out_tol || 0) });
  });
  return list.map(e => { const [h, m] = String(e.at).slice(0, 5).split(':').map(Number); const t = new Date(); t.setHours(h, m, 0, 0); return Object.assign({}, e, { t }); })
    .sort((a, b) => a.t - b.t);
}

function currentEvent(cfg) {
  const now = new Date(); const ev = schedEvents(cfg); let cur = ev[0];
  ev.forEach(e => { if (e.t <= now) cur = e; });
  return cur;
}

function effectiveStatus(row) {
  if (row.review === 'present') return 'حاضر';
  if (row.review === 'absent') return 'غائب';

}

async function recordStaffCheckin(method, photo, similarity) {
  const { data: cfg } = await db.from('attendance_settings').select('*').eq('school_id', profile.school_id).maybeSingle();
  if (!cfg || !cfg.enabled) return toast('الحضور غير مفعّل في المؤسسة', 'err');
  const now = new Date();
  if (cfg.schedule && cfg.schedule.end) {
    const [eh, em] = String(cfg.schedule.end).slice(0, 5).split(':').map(Number);
    const endAt = new Date(); endAt.setHours(eh, em, 0, 0);
    if (now > endAt) return toast('انتهى وقت التسجيل لهذا اليوم', 'err');
  }
  const ev = currentEvent(cfg);
  const late = now > new Date(ev.t.getTime() + ev.tol * 60000);
  const row = { school_id: profile.school_id, profile_id: me.id, checkin_date: today(), method, period: ev.period, kind: ev.kind, late, checkin_time: now.toISOString() };
  if (photo) { row.photo = photo; row.similarity = similarity; }
  const { error } = await db.from('staff_checkins').insert(row);
  if (error) return toast(/duplicate|unique/i.test(error.message) ? 'تم تسجيل هذا الحدث اليوم مسبقا' : 'خطأ: ' + error.message, 'err');
  const warn = (similarity !== null && similarity !== undefined && similarity < 60)
    ? `<p style="color:#b45309">⚠️ تنبيه: الصورة تختلف عن النموذج (${similarity}%)، وسيراجعها المدير.</p>` : '';
  showModal('✅ تم تسجيل الحضور', `<p>${esc(profile.full_name)}</p>
    <p>${ev.period === 'morning' ? 'صباحا' : 'مساء'} — ${ev.kind === 'in' ? 'دخول' : 'خروج'} — ${now.toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit' })}</p>

}

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

async function similarity(a, b) {
  try {
    const sig = async src => {
      const im = await loadImg(src); const c = document.createElement('canvas'); c.width = 24; c.height = 24;
      const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, 24, 24);
      const d = ctx.getImageData(0, 0, 24, 24).data; const g = [];
      for (let i = 0; i < d.length; i += 4) g.push(d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11);
      return g;
    };
    const x = await sig(a), y = await sig(b);
    const mx = x.reduce((s, v) => s + v, 0) / x.length, my = y.reduce((s, v) => s + v, 0) / y.length;
    let num = 0, dx = 0, dy = 0;
    for (let i = 0; i < x.length; i++) { const p = x[i] - mx, q = y[i] - my; num += p * q; dx += p * p; dy += q * q; }
    const corr = (dx && dy) ? num / Math.sqrt(dx * dy) : 0;
    return Math.max(0, Math.round(corr * 100));
  } catch (e) { return null; }
}

async function camShoot(mode) {
  const v = $('camVid');
  if (!v || !v.videoWidth) return toast('انتظر ظهور الصورة ثم التقط', 'err');
  const c = document.createElement('canvas'); const k = Math.min(1, 480 / v.videoWidth);
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.6);
  camStop();
  if (mode === 'template') {
    const { error } = await db.from('attendance_settings').upsert({ school_id: profile.school_id, template: url }, { onConflict: 'school_id' });

}

// الجداول والبطاقات الداكنة تصبح بيضاء بكتابة سوداء تلقائيا، والحقول داخل الصفحة كلها
(function () {
  const isDark = c => {
    const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if (!m) return false;
    if (m[4] !== undefined && Number(m[4]) < 0.5) return false;
    return (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) < 110;
  };
  function fix(root) {
    root.querySelectorAll('*').forEach(el => {
      if (el.closest('.side') || el.closest('.top') || el.closest('#tifoPageOv')) return;
      if (['IMG', 'SVG', 'CANVAS', 'VIDEO', 'SCRIPT', 'BUTTON', 'A'].includes(el.tagName)) return;
      if (el.classList.contains('btn') || el.id === 'bellBtn') return;
      const cs = getComputedStyle(el);
      if (cs.position === 'fixed') return;
      if (isDark(cs.backgroundColor)) {
        el.style.setProperty('background', '#FFFFFF', 'important');
        el.style.setProperty('color', '#101010', 'important');
      }
    });
  }
  let t;
  new MutationObserver(() => {
    clearTimeout(t);
    t = setTimeout(() => {
      const root = document.body.classList.contains('in-app') ? (document.getElementById('content') || document.querySelector('main')) : document.body;
      if (root) fix(root);
    }, 150);
  }).observe(document.body, { childList: true, subtree: true });
})();

function parseRange(txt) {
  const m = String(txt).match(/(\d{1,2}):?(\d{2})?\s*-\s*(\d{1,2}):?(\d{2})?/);
  const a = new Date(), b = new Date();
  if (!m) return [a, a];
  a.setHours(+m[1], +(m[2] || 0), 0, 0); b.setHours(+m[3], +(m[4] || 0), 0, 0);
  return [a, b];
}

function beepAlert() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.45, 0.9].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.35;
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
  } catch (e) {}
}

const remindLast = {};

async function loadSessions() {
  const dt = $('sd').value;
  const wd = new Date(dt + 'T12:00:00').getDay();
  if (wd > 4) return $('sess').innerHTML = empty('🗓️', 'هذا اليوم عطلة أسبوعية، لا توجد حصص');
  if (profile.role === 'enseignant' && !window._myTeacherId) {
    const { data: t } = await db.from('teachers').select('id').eq('full_name', profile.full_name).maybeSingle();
    window._myTeacherId = t?.id || null;
  }
  const [{ data: tt }, { data: ab }, { data: sg }] = await Promise.all([
    db.from('timetable').select('period,grp,subject,class_id,teacher_id,teachers(full_name),classes(level,number)').eq('weekday', wd).order('period'),
    db.from('student_absences').select('class_id,period').eq('absence_date', dt),
    db.from('session_signatures').select('class_id,period,signed_by_name,signed_at').eq('absence_date', dt)
  ]);
  const done = new Set((ab || []).map(a => a.class_id + '-' + a.period));
  const signed = {}; (sg || []).forEach(x => signed[x.class_id + '-' + x.period] = x);
  const fState = $('sf-state') ? $('sf-state').value : '', fCls = $('sf-cls') ? $('sf-cls').value : '', fHr = $('sf-hr') ? $('sf-hr').value : '';
  const mine = (tt || []).filter(r => profile.role !== 'enseignant' || (window._myTeacherId && r.teacher_id === window._myTeacherId))
    .filter(r => (!fCls || r.class_id === fCls) && (!fHr || String(r.period) === fHr));
  const isToday = dt === today(), now = new Date();
  const stateOf = r => {
    const key = r.class_id + '-' + r.period;
    if (signed[key]) return 'signed';
    if (done.has(key)) return 'done';
    if (!isToday) return 'late';
    const [a, b] = parseRange(TIMES[r.period]);
    if (now < a) return 'upcoming';
    if (now < b) return 'current';
    return 'late';
  };
  const rows = mine.map(r => ({ r, st: stateOf(r), range: parseRange(TIMES[r.period]) }));
  const label = { signed: '✔ موقّعة', done: '✔ مسجلة', upcoming: '⏳ لم يحن وقتها', current: '🟡 جارية الآن', late: '🔴 بانتظار التسجيل' };
  const group = (k, title) => {
    const list = rows.filter(x => x.st === k);
    if (!list.length) return '';
    return `<h4 style="margin:12px 0 6px">${title} (${list.length})</h4>` + list.map(({ r, st, range }) => {
      const key = r.class_id + '-' + r.period, sg2 = signed[key];
      const mins = Math.max(0, Math.round((range[0] - now) / 60000));
      const timer = st === 'upcoming' ? `<small class="muted">تبدأ بعد ${mins} دقيقة</small>` : (st === 'current' ? '<small class="muted">الحصة جارية الآن</small>' : '');
      const sigTxt = sg2 ? `<br><small>✍️ وقّعها: ${esc(sg2.signed_by_name || '')}</small>` : '';
      const btn = (st === 'done' || st === 'signed') ? '' : `<button class="btn small" onclick="goRecord('${r.class_id}',${r.period})">📝 تسجيل الحضور</button>`;
      return `<div class="row"><span class="badge info">${esc(TIMES[r.period] || '')}</span>
        <span class="grow"><b>${r.classes ? classLabel(r.classes) : ''}</b> · الفوج ${r.grp} · ${esc(r.subject || '')}<br>
        <small class="muted">🧑‍🏫 ${esc(r.teachers?.full_name || '—')}</small> ${timer}${sigTxt}</span>
        <span class="badge">${label[st]}</span> ${btn}</div>`;
    }).join('');
  };
  $('sess').innerHTML = `
    <div class="stats-mini">
      <div class="mini s1b">حصص اليوم<b>${rows.length}</b></div>
      <div class="mini s2b">مسجلة وموقّعة<b>${rows.filter(x => x.st === 'done' || x.st === 'signed').length}</b></div>
      <div class="mini s3b">بانتظار التسجيل<b>${rows.filter(x => x.st === 'current' || x.st === 'late').length}</b></div>
    </div>
    ${group('current', 'حصص جارية')}
    ${group('late', 'حصص لم تُسجَّل بعد')}
    ${group('upcoming', 'حصص لم يحن وقتها')}
    ${group('done', 'حصص مسجلة')}
    ${group('signed', 'حصص مسجلة وموقّعة')}
    ${rows.length ? '' : empty('✅', 'لا توجد حصص مبرمجة لهذا اليوم. أضفها من استعمال الزمن.')}`;
  if (isToday && profile.role === 'enseignant') startSessTicker(rows);
}

function startSessTicker(rows) {
  clearInterval(window._sessTimer);
  window._sessTimer = setInterval(() => {
    if (!document.getElementById('sess') || location.hash.indexOf('sessions') < 0) return clearInterval(window._sessTimer);
    loadSessions();
  }, 60000);
  const now = Date.now();
  (rows || []).forEach(x => {
    if (x.st !== 'current' && x.st !== 'late') return;
    const key = x.r.class_id + '-' + x.r.period;
    if (now - (remindLast[key] || 0) >= 15 * 60000) {
      remindLast[key] = now;
      beepAlert();
      showModal('⏰ تذكير بتسجيل الحضور', `<p><b>${esc(x.r.classes ? classLabel(x.r.classes) : '')}</b> — ${esc(x.r.subject || '')}</p>
        <p style="font-size:18px">لم تُسجّل حضور التلاميذ بعد. سجّل الحضور واضغط زر <b>حفظ الحضور</b> لإيقاف التذكير.</p>`);
    }
  });
}

<script>
(function () {
  const UPDATES = [
    { d: '2026-11-10', t: 'صفحة رسائل الدعم: ترد على المدارس وتصلهم ردودك داخل التطبيق' },
    { d: '2026-11-10', t: 'استيراد التلاميذ والأساتذة من ملف الإكسل بالنموذج الجديد' },
    { d: '2026-11-09', t: 'الدخول بالاسم الكامل أو اسم المستخدم أو البريد الإلكتروني' }
  ];
  const seenKey = () => 'tifoSeen:' + (me && me.id);

  async function notices() {
    if (!me) return [];
    const { data } = await db.from('support_messages')
      .select('id, message, reply, replied_at, auto_reply, created_at')
      .eq('sender_id', me.id).order('created_at', { ascending: false }).limit(30);
    const seen = localStorage.getItem(seenKey()) || '1970-01-01T00:00:00';
    const out = [];
    (data || []).forEach(m => {
      if (m.reply && (m.replied_at || '') > seen) out.push({ kind: 'رد الدعم', text: m.reply, orig: m.message, at: m.replied_at });
      else if (m.auto_reply && (m.created_at || '') > seen) out.push({ kind: 'رد تلقائي', text: m.auto_reply, orig: m.message, at: m.created_at });
    });
    return out;
  }

  async function refreshBadge() {
    const b = document.getElementById('bellCount');
    if (!b) return;
    const n = (await notices()).length;
    b.textContent = n;
    b.style.display = n ? 'inline-block' : 'none';
  }

  async function openBell() {
    const list = await notices();
    const items = list.map(n => `<div class="card" style="margin:0 0 10px">
        <small class="muted">${n.kind} — ${String(n.at || '').slice(0, 16).replace('T', ' ')}</small>
        <p style="margin:6px 0">${esc(n.text)}</p>
        <small class="muted">رسالتك: ${esc(String(n.orig || '').slice(0, 120))}</small></div>`).join('');
    const upd = UPDATES.map(u => `<div style="padding:8px 0;border-bottom:1px solid rgba(212,175,55,.3)">
        <small class="muted">${u.d}</small><br>${esc(u.t)}</div>`).join('');
    showModal('🔔 الإشعارات', `
      <h4 style="margin:0 0 8px;color:#D4AF37">ردود الدعم الفني</h4>
      ${items || '<p class="muted">لا توجد ردود جديدة</p>'}
      <h4 style="margin:14px 0 8px;color:#D4AF37">التحديثات الجديدة</h4>${upd}`);
    localStorage.setItem(seenKey(), new Date().toISOString());
    refreshBadge();
  }

  function addBell() {
    const top = document.querySelector('.top');
    if (!top || document.getElementById('bellBtn') || !me) return;
    const btn = document.createElement('button');
    btn.id = 'bellBtn';
    btn.type = 'button';
    btn.title = 'الإشعارات';
    btn.style.cssText = 'position:relative;width:42px;height:42px;border-radius:50%;border:1.5px solid #D4AF37;background:linear-gradient(135deg,#1E3E85,#12275A);color:#FFF;font-size:20px;cursor:pointer;box-shadow:0 0 16px rgba(212,175,55,.7);margin:0 8px;flex:0 0 auto';
    btn.innerHTML = '🔔<span id="bellCount" style="display:none;position:absolute;top:-6px;left:-6px;background:#dc2626;color:#fff;border-radius:12px;padding:1px 6px;font-size:12px"></span>';
    btn.onclick = openBell;
    top.insertBefore(btn, top.firstChild);
    refreshBadge();
  }

  setInterval(() => {
    if (me && document.querySelector('.top') && !document.getElementById('bellBtn')) addBell();
  }, 1500);
  setInterval(refreshBadge, 60000);
})();
</script>

abel { display:block; margin:12px 0 4px; color:#E8C96A; }\n  input, select { width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:1px solid #D4AF37; background:#0F2340; color:#fff; font:inherit; }\n  button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:12px; font:inherit; font-weight:bold; color:#0F2340; cursor:pointer; background:linear-gradient(135deg,#D4AF37,#F5E08A); box-shadow:0 0 20px rgba(212,175,55,.7); }\n  #msg { margin-top:12px; text-align:center; color:#fde68a; min-height:24px; }\n  .hidden { display:none; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <h1>الدفع عبر CCP<\/h1>\n  <p style=\"text-align:center\"><a target=\"_top\" href=\"/\" target=\"_top\" style=\"color:#F5D76E\">العودة إلى التطبيق لإنشاء المؤسسة بعد رفع الوصل<\/a><\/p>\n\n  <div class=\"card\">\n    <div class=\"ccp\">رقم CCP: <span id=\"ccpNum\"><\/span><br>الاسم: <span id=\"ccpName\"><\/span><\/div>\n    <div class=\"rule\">\n      <b>قبل تصوير الوصل:<\/b> اكتب بخط واضح <b>اسم مؤسستك ورقم هاتفك<\/b> في مكان فارغ أبيض في الوصل.<br>\n      ممنوع الكتابة فوق المبلغ، أو فوق رقم حساب CCP، أو في الخلف، أو فوق الختم.<br>\n      أي وصل بدون اسم، أو مكتوب فوقه، سيُرفض.\n    <\/div>\n  <\/div>\n\n  <div id=\"loginBox\" class=\"card\">\n    <label>البريد الإلكتروني للمدير<\/label>\n    <input id=\"em\" type=\"email\">\n    <label>كلمة المرور<\/label>\n    <input id=\"pw\" type=\"password\">\n    <button onclick=\"login()\">دخول<\/button>\n  <\/div>\n\n  <form id=\"formBox\" class=\"card hidden\" onsubmit=\"submitProof(event)\">\n    <label>الخطة<\/label>\n    <select id=\"plan\">\n      <option value=\"basic\">أساسي<\/option>\n      <option value=\"pro\">احترافي<\/option>\n      <option value=\"pro_duo\">شبكة مدرستين<\/option>\n    <\/select>\n    <label>المدة<\/label>\n    <select id=\"months\"><option value=\"1\">شهر<\/option><option value=\"12\">سنة<\/option><\/select>\n    <label>الاسم الذي كتبته في الوصل (إجباري)<\/label>\n    <input id=\"wname\" required minlength=\"3\">\n    <label>رقم الوصل (اختياري)<\/label>\n    <input id=\"rno\">\n    <label>📷 صورة الوصل: اضغط هنا لاختيار صورة من الهاتف أو الكمبيوتر<\/label>\n    <input id=\"file\" type=\"file\" accept=\"image/*\" required>\n    <button type=\"submit\">إرسال الوصل<\/button>\n  <\/form>\n\n  <div id=\"msg\"><\/div>\n<\/div>\n\n<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js\"><\/script>\n<script>\n  // ضع رقم CCP واسم صاحبه هنا\n  const CCP_NUMBER = 'ضع_رقم_CCP_هنا';\n  const CCP_NAME = 'ضع_اسم_صاحب_الحساب_هنا';\n\n  const SUPABASE_URL = 'https://lhbyvjlwbeydwplohiso.supabase.co';\n  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoYnl2amx3YmV5ZHdwbG9oaXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDE0OTAsImV4cCI6MjEwODE3NzQ5MH0.bdBRGrxsfmkWjeesSGm9gPAeTieot-AvNuCEHQ7gzpU';\n  if (!window.supabase) { document.getElementById('msg').textContent = 'تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم حدّث الصفحة.'; }\n  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);\n  const $ = id => document.getElementById(id);\n  const say = t => $('msg').textContent = t;\n\n  $('ccpNum').textContent = CCP_NUMBER;\n  $('ccpName').textContent = CCP_NAME;\n  const pre = new URLSearchParams(location.search).get('plan');\n  if (pre && ['basic','pro','pro_duo'].includes(pre)) $('plan').value = pre;\n\n  async function showState() {\n    const { data: { session } } = await db.auth.getSession();\n    if (!session) $('msg').textContent = 'سجّل الدخول بحساب المدير لإرسال الوصل';\n    $('loginBox').classList.toggle('hidden', !!session);\n    $('formBox').classList.toggle('hidden', !session);\n  }\n\n  async function login() {\n    const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });\n    if (error) return say('خطأ: ' + error.message);\n    say(''); showState();\n  }\n\n  // ضغط الصورة مهما كان حجمها ونوعها، ثم تحويلها إلى JPEG\n  function compressImage(file) {\n    return new Promise((res, rej) => {\n      const url = URL.createObjectURL(file);\n      const img = new Image();\n      img.onload = () => {\n        const k = Math.min(1, 1600 / Math.max(img.width, img.height));\n        const c = document.createElement('canvas');\n        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));\n        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n        URL.revokeObjectURL(url);\n        c.toBlob(b => b ? res(b) : rej(new Error('تعذر تحويل الصورة')), 'image/jpeg', 0.85);\n      };\n      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('تعذر قراءة هذه الصورة، جرّب صورة أخرى')); };\n      img.src = url;\n    });\n  }\n\n  async function sha256Hex(blob) {\n    const buf = await blob.arrayBuffer();\n    const d = await crypto.subtle.digest('SHA-256', buf);\n    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');\n  }\n\n  async function submitProof(e) {\n    e.preventDefault();\n    const { data: { user } } = await db.auth.getUser();\n    if (!user) return say('سجّل الدخول أولا');\n    const { data: prof, error: pe } = await db.from('profiles').select('school_id, role').eq('id', user.id).single();\n    if (pe || !prof) return say('سجّل الدخول بالحساب الذي ستنشئ به المؤسسة');\n    if (prof.school_id && prof.role !== 'directeur') return say('هذه الصفحة للمدير فقط');\n    const name = $('wname').value.trim();\n    if (name.length < 3) return say('اكتب الاسم الذي كتبته في الوصل');\n    const f = $('file').files[0];\n    if (!f) return say('ارفع صورة الوصل');\n    try {\n      say('جاري الرفع...');\n      const blob = await compressImage(f);\n      const hash = await sha256Hex(blob);\n      const path = `${prof.school_id || user.id}/${Date.now()}.jpg`;\n      const up = await db.storage.from('payment-proofs').upload(path, blob, { contentType: 'image/jpeg' });\n      if (up.error) return say('فشل رفع الصورة: ' + up.error.message);\n      const { error } = await db.from('payment_proofs').insert({\n        school_id: prof.school_id || null, sender_id: user.id, plan_id: $('plan').value,\n        months: parseInt($('months').value, 10), written_name: name,\n        receipt_no: $('rno').value.trim() || null, image_path: path, image_hash: hash });\n      if (error) {\n        await db.storage.from('payment-proofs').remove([path]);\n        return say(/duplicate|unique/i.test(error.message) ? 'هذا الوصل سبق رفعه' : 'خطأ: ' + error.message);\n      }\n      $('formBox').reset();\n      say('تم استلام الوصل ✅ سيراجعه المالك، ويُفعَّل اشتراكك بعد التأكيد.');\n    } catch (err) { say(err.message); }\n  }\n\n  db.auth.onAuthStateChange(() => showState());\n  showState();\n<\/script>\n<\/body>\n<\/html>\n", "owner": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<title>لوحة المالك<\/title>\n<style>\n  body { margin:0; font-family:Cairo, Tahoma, Arial, sans-serif; background:#0F2340; color:#fff; padding:18px; min-height:100vh; }\n  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }\n  h1 { color:#D4AF37; margin:0; text-shadow:0 0 12px rgba(212,175,55,.7); }\n  h3 { color:#E8C96A; margin:0 0 10px; }\n  .card { background:#132A5A; border:1.5px solid #D4AF37; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 0 18px rgba(212,175,55,.25); overflow-x:auto; }\n  .login { max-width:420px; margin:60px auto; }\n  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }\n  .stat { background:linear-gradient(145deg,#1E3E85,#12275A); border:1.5px solid #D4AF37; border-radius:12px; padding:12px; text-align:center; }\n  .stat b { display:block; font-size:28px; text-shadow:0 0 12px rgba(255,255,255,.7); }\n  input, select, button, textarea { font:inherit; padding:9px; border-radius:8px; border:1px solid #D4AF37; margin:3px; box-sizing:border-box; }\n  input, select, textarea { background:#0F2340; color:#fff; }\n  input.full { width:100%; margin:6px 0; }\n  button { background:linear-gradient(135deg,#D4AF37,#E8C96A); color:#0F2340; font-weight:bold; cursor:pointer; }\n  button.red { background:#b91c1c; color:#fff; }\n  .bell { position:relative; width:46px; height:46px; border-radius:50%; font-size:22px; cursor:pointer;\n    box-shadow:0 0 18px rgba(212,175,55,.8); background:#132A5A; border:1.5px solid #D4AF37; color:#fff; }\n  .badge { position:absolute; top:-6px; left:-6px; background:#dc2626; color:#fff; border-radius:12px; padding:1px 7px; font-size:12px; }\n  #bellList { display:none; position:absolute; top:52px; left:0; width:320px; max-height:360px; overflow:auto; z-index:9;\n    background:#132A5A; border:1.5px solid #D4AF37; border-radius:12px; padding:10px; box-shadow:0 0 24px rgba(212,175,55,.5); }\n  .wrapBell { position:relative; }\n  table { width:100%; border-collapse:collapse; font-size:14px; }\n  td, th { border:1px solid #334e8c; padding:6px; text-align:center; vertical-align:middle; }\n  th { background:#1E3E85; color:#E8C96A; }\n  td.r { text-align:right; }\n  img.proof { max-width:120px; border-radius:8px; border:1px solid #D4AF37; }\n  .muted { color:#94a3b8; }\n  #msg { margin:10px 0; color:#E8C96A; min-height:20px; }\n  .hidden { display:none; }\n<\/style>\n<\/head>\n<body>\n\n<div id=\"loginBox\" class=\"card login\">\n  <h3>تسجيل دخول المالك<\/h3>\n  <input id=\"em\" class=\"full\" type=\"email\" placeholder=\"البريد الإلكتروني\">\n  <input id=\"pw\" class=\"full\" type=\"password\" placeholder=\"كلمة المرور\">\n  <button onclick=\"login()\" style=\"width:100%;margin-top:8px\">دخول<\/button>\n  <div id=\"loginMsg\" style=\"color:#E8C96A;margin-top:10px;min-height:20px\"><\/div>\n<\/div>\n\n<div id=\"app\" class=\"hidden\">\n  <div class=\"top\">\n    <h1>لوحة المالك<\/h1>\n    <div class=\"wrapBell\">\n      <button class=\"bell\" onclick=\"toggleBell()\" title=\"الإشعارات\">🔔<span id=\"bellCount\" class=\"badge\" style=\"display:none\">0<\/span><\/button>\n      <div id=\"bellList\"><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"msg\"><\/div>\n\n  <div class=\"stats\">\n    <div class=\"stat\"><span>وصولات بانتظار المراجعة<\/span><b id=\"sPending\">0<\/b><\/div>\n    <div class=\"stat\"><span>رسائل دعم بلا رد<\/span><b id=\"sMsgNoReply\">0<\/b><\/div>\n    <div class=\"stat\"><span>اشتراكات نشطة<\/span><b id=\"sActive\">0<\/b><\/div>\n    <div class=\"stat\"><span>مدارس مسجلة<\/span><b id=\"sSchools\">0<\/b><\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>طلبات الدفع (CCP)<\/h3>\n    <table id=\"payTbl\"><\/table>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>رسائل الدعم الفني والرد عليها<\/h3>\n    <table id=\"msgTbl\"><\/table>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>الخطط: الأسعار والحدود (تنعكس على كل المدارس فورا)<\/h3>\n    <table id=\"planTbl\"><\/table>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>منح حساب مجاني<\/h3>\n    <input id=\"gEmail\" type=\"email\" placeholder=\"بريد مدير المؤسسة\" style=\"width:100%;max-width:360px\">\n    <select id=\"gPlan\"><option value=\"basic\">أساسي<\/option><option value=\"pro\">احترافي<\/option><option value=\"pro_duo\">شبكة مدرستين<\/option><\/select>\n    <select id=\"gMonths\"><option value=\"1\">شهر<\/option><option value=\"12\">سنة<\/option><\/select>\n    <button onclick=\"grant()\">منح<\/button>\n  <\/div>\n\n  <div class=\"card\">\n    <h3>الاشتراكات<\/h3>\n    <table id=\"subTbl\"><\/table>\n  <\/div>\n<\/div>\n\n<script src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js\"><\/script>\n<script>\n  const SUPABASE_URL = 'https://lhbyvjlwbeydwplohiso.supabase.co';\n  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoYnl2amx3YmV5ZHdwbG9oaXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDE0OTAsImV4cCI6MjEwODE3NzQ5MH0.bdBRGrxsfmkWjeesSGm9gPAeTieot-AvNuCEHQ7gzpU';\n  const OWNER_EMAIL = 'abdlkarimtifoun96@gmail.com';\n  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);\n  const $ = id => document.getElementById(id);\n  const say = t => $('msg').textContent = t;\n  const esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  const day = v => v ? String(v).slice(0, 10) : '';\n  let unanswered = [];\n\n  // الحماية الحقيقية في قاعدة البيانات (RLS والدوال). هذا الفحص للعرض فقط.\n  async function login() {\n    $('loginMsg').textContent = 'جاري الدخول...';\n    const slow = setTimeout(() => { $('loginMsg').textContent = 'الاتصال يتأخر. افتح Console (زر F12) وأرسل لي أي سطر أحمر، ثم جرّب تحديث الصفحة'; }, 12000);\n    try {\n      const { data, error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });\n      clearTimeout(slow);\n      console.log('signIn result', { ok: !!data?.session, error: error?.message });\n      if (error) { $('loginMsg').textContent = 'خطأ: ' + error.message; return; }\n      $('loginMsg').textContent = 'تم الدخول، جاري فتح اللوحة...';\n      await start();\n    } catch (e) {\n      clearTimeout(slow);\n      console.log('login exception', e);\n      $('loginMsg').textContent = 'خطأ: ' + e.message;\n    }\n  }\n\n  async function start() {\n    const { data: { user } } = await db.auth.getUser();\n    if (!user) { $('loginBox').classList.remove('hidden'); $('app').classList.add('hidden'); console.log('no session after login'); return; }\n    if ((user.email || '').toLowerCase() !== OWNER_EMAIL) {\n      $('loginBox').classList.remove('hidden'); $('app').classList.add('hidden');\n      $('loginMsg').textContent = 'هذا الحساب ليس حساب المالك';\n      return;\n    }\n    window.OWNER_ID = user.id;\n    $('loginBox').classList.add('hidden');\n    $('app').classList.remove('hidden');\n    loadAll();\n  }\n\n  async function loadAll() {\n    await Promise.all([loadStats(), loadPayments(), loadMsgs(), loadSubs(), loadPlans()]);\n    updateBell();\n  }\n\n  async function loadStats() {\n    const count = async q => { const { count } = await q; return count || 0; };\n    $('sPending').textContent = await count(db.from('payment_proofs').select('id', { count: 'exact', head: true }).eq('status', 'pending'));\n    $('sMsgNoReply').textContent = await count(db.from('support_messages').select('id', { count: 'exact', head: true }).is('reply', null));\n    $('sActive').textContent = await count(db.from('subscriptions').select('id', { count: 'exact', head: true }).eq('status', 'active'));\n    $('sSchools').textContent = await count(db.from('schools').select('id', { count: 'exact', head: true }));\n  }\n\n  async function loadPayments() {\n    const { data, error } = await db.from('payment_proofs')\n      .select('id, plan_id, months, written_name, receipt_no, image_path, status, created_at, schools(name)')\n      .order('created_at', { ascending: false });\n    if (error) return say('لا يمكن قراءة الطلبات: ' + error.message);\n    const rows = await Promise.all((data || []).map(async p => {\n      const { data: s } = await db.storage.from('payment-proofs').createSignedUrl(p.image_path, 600);\n      const actions = (p.status === 'pending'\n        ? `<button onclick=\"review('${p.id}', true)\">تأكيد<\/button><button class=\"red\" onclick=\"review('${p.id}', false)\">رفض<\/button>`\n        : '') + `<button class=\"red\" onclick=\"delPayment('${p.id}')\">🗑️ حذف<\/button>`;\n      return `<tr><td>${esc(p.schools?.name || '')}<\/td><td>${esc(p.plan_id)} (${p.months === 12 ? 'سنة' : 'شهر'})<\/td>\n        <td>${esc(p.written_name)}<\/td><td>${esc(p.receipt_no || '—')}<\/td>\n        <td>${s ? `<a href=\"${s.signedUrl}\" target=\"_blank\"><img class=\"proof\" src=\"${s.signedUrl}\"><\/a>` : '—'}<\/td>\n        <td>${esc(p.status)}<\/td><td>${actions}<\/td><\/tr>`;\n    }));\n    $('payTbl').innerHTML = '<tr><th>المؤسسة<\/th><th>الخطة<\/th><th>الاسم في الوصل<\/th><th>رقم الوصل<\/th><th>الصورة<\/th><th>الحالة<\/th><th>إجراء<\/th><\/tr>' + rows.join('');\n  }\n\n  async function loadMsgs() {\n    const { data } = await db.from('support_messages')\n      .select('id, full_name, institution, email, message, created_at, reply, sender_id')\n      .order('created_at', { ascending: false }).limit(100);\n    unanswered = (data || []).filter(m => !m.reply);\n    $('msgTbl').innerHTML = '<tr><th>التاريخ<\/th><th>الاسم<\/th><th>المؤسسة<\/th><th>البريد<\/th><th>الرسالة<\/th><th>الرد<\/th><\/tr>' +\n      (data || []).map(m => `<tr>\n        <td>${day(m.created_at)}<\/td><td>${esc(m.full_name)}<\/td><td>${esc(m.institution || '')}<\/td><td>${esc(m.email)}<\/td>\n        <td class=\"r\" style=\"max-width:320px;white-space:pre-wrap\">${esc(m.message)}<\/td>\n        <td style=\"min-width:260px\">${m.reply\n          ? `<span style=\"color:#86efac\">تم الرد<\/span><br><small class=\"muted\">${esc(m.reply)}<\/small>`\n          : `<textarea id=\"rp-${m.id}\" rows=\"2\" style=\"width:100%\" placeholder=\"اكتب ردك\"><\/textarea>\n             <button onclick=\"sendReply('${m.id}')\">📤 إرسال الرد<\/button>`}<\/td><\/tr>`).join('');\n  }\n\n  async function sendReply(id) {\n    const m = (await db.from('support_messages').select('*').eq('id', id).single()).data;\n    const txt = $('rp-' + id).value.trim();\n    if (!txt) return say('اكتب الرد أولا');\n    const { error } = await db.from('support_messages').update({ reply: txt, replied_at: new Date().toISOString(), replied_by: window.OWNER_ID }).eq('id', id);\n    if (error) return say('خطأ: ' + error.message);\n    const { error: e2 } = await db.functions.invoke('send-support-notification', {\n      body: { action: 'reply', to: m.email, full_name: m.full_name, original: m.message, reply: txt } });\n    say(e2 ? 'حُفظ الرد داخل التطبيق، لكن تعذر إرسال البريد إلى المرسل' : 'تم إرسال الرد ✅');\n    loadAll();\n  }\n\n  async function loadSubs() {\n    const { data } = await db.from('subscriptions')\n      .select('plan_id, status, start_date, end_date, is_manual_grant, schools(name)')\n      .order('created_at', { ascending: false }).limit(100);\n    $('subTbl').innerHTML = '<tr><th>المؤسسة<\/th><th>الخطة<\/th><th>الحالة<\/th><th>البداية<\/th><th>النهاية<\/th><th>منحة يدوية<\/th><\/tr>' +\n      (data || []).map(s => `<tr><td>${esc(s.schools?.name || '')}<\/td><td>${esc(s.plan_id)}<\/td><td>${esc(s.status)}<\/td>\n        <td>${day(s.start_date)}<\/td><td>${day(s.end_date)}<\/td><td>${s.is_manual_grant ? 'نعم' : 'لا'}<\/td><\/tr>`).join('');\n  }\n\n  // الجرس: رسائل بلا رد + وصولات بانتظار المراجعة\n  async function updateBell() {\n    const pending = (await db.from('payment_proofs').select('id', { count: 'exact', head: true }).eq('status', 'pending')).count || 0;\n    const n = unanswered.length + pending;\n    $('bellCount').textContent = n;\n    $('bellCount').style.display = n ? 'inline-block' : 'none';\n    $('bellList').innerHTML = (unanswered.length ? unanswered.map(m =>\n        `<div style=\"padding:8px 0;border-bottom:1px solid rgba(212,175,55,.3)\"><b>رسالة دعم<\/b> — ${esc(m.full_name)}<br>\n         <small class=\"muted\">${esc(String(m.message).slice(0, 80))}<\/small><\/div>`).join('')\n      : '<p class=\"muted\">لا توجد رسائل بلا رد<\/p>')\n      + `<div style=\"padding:8px 0\"><b>وصولات بانتظار المراجعة:<\/b> ${pending}<\/div>`;\n  }\n  function toggleBell() { const b = $('bellList'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }\n\n  async function review(id, approve) {\n    const { error } = await db.rpc('owner_review_payment', { p_id: id, p_approve: approve });\n    if (error) return say('خطأ: ' + error.message);\n    say(approve ? 'تم تأكيد الدفع وتفعيل الاشتراك ✅' : 'تم رفض الطلب');\n    loadAll();\n  }\n\n  async function delPayment(id) {\n    if (!confirm('حذف الوصل نهائيا من المخزن والسجل؟')) return;\n    const { error } = await db.rpc('owner_delete_payment', { p_id: id });\n    if (error) return say('خطأ: ' + error.message);\n    say('تم حذف الوصل');\n    loadAll();\n  }\n\n  async function grant() {\n    const { error } = await db.rpc('owner_grant_free', {\n      p_email: $('gEmail').value.trim(), p_plan: $('gPlan').value, p_months: parseInt($('gMonths').value, 10) });\n    if (error) return say('خطأ: ' + error.message);\n    say('تم منح الاشتراك المجاني ✅');\n    loadAll();\n  }\n\n  async function loadPlans() {\n    const { data } = await db.from('plans').select('*').order('price_month', { ascending: true, nullsFirst: true });\n    const num = v => v === null || v === undefined ? '' : v;\n    $('planTbl').innerHTML = '<tr><th>الخطة<\/th><th>الاسم<\/th><th>حد التلاميذ<\/th><th>حد الأساتذة (فارغ = غير محدود)<\/th><th>سعر الشهر<\/th><th>سعر السنة<\/th><th>مفعّلة<\/th><th>حفظ<\/th><\/tr>' +\n      (data || []).map(p => `<tr data-id=\"${esc(p.id)}\">\n        <td>${esc(p.id)}<\/td>\n        <td><input class=\"pn\" value=\"${esc(p.name_ar)}\"><\/td>\n        <td><input class=\"pst\" type=\"number\" min=\"0\" value=\"${num(p.max_students)}\" style=\"width:90px\"><\/td>\n        <td><input class=\"pte\" type=\"number\" min=\"0\" value=\"${num(p.max_teachers)}\" style=\"width:90px\"><\/td>\n        <td><input class=\"pm\" type=\"number\" min=\"0\" value=\"${num(p.price_month)}\" style=\"width:90px\"><\/td>\n        <td><input class=\"py\" type=\"number\" min=\"0\" value=\"${num(p.price_year)}\" style=\"width:90px\"><\/td>\n        <td><input class=\"pa\" type=\"checkbox\" ${p.active ? 'checked' : ''}><\/td>\n        <td><button onclick=\"savePlan('${esc(p.id)}', this)\">💾<\/button><\/td><\/tr>`).join('');\n  }\n\n  async function savePlan(id, btn) {\n    const tr = btn.closest('tr');\n    const val = c => { const v = tr.querySelector(c).value.trim(); return v === '' ? null : parseInt(v, 10); };\n    const { error } = await db.from('plans').update({\n      name_ar: tr.querySelector('.pn').value.trim(),\n      max_students: val('.pst'), max_teachers: val('.pte'),\n      price_month: val('.pm'), price_year: val('.py'),\n      active: tr.querySelector('.pa').checked }).eq('id', id);\n    say(error ? 'خطأ: ' + error.message : 'تم حفظ الخطة ✅');\n  }\n\n  db.auth.onAuthStateChange(() => start());\n  start();\n<\/script>\n<\/body>\n<\/html>\n"};
(function () {
  function openPage(key, hash) {
    let html = TIFO_PAGES[key];
    const q = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?')) : '';
    if (key === 'pay' && q) html = html.replace('new URLSearchParams(location.search)', "new URLSearchParams('" + q + "')");
    document.open(); document.write(html); document.close();
  }
  function check() {
    const m = (location.hash || '').match(/^#\/(pricing|pay|owner)(\?.*)?$/);
    if (m) openPage(m[1], location.hash);
  }
  window.addEventListener('hashchange', check);
  check();
})();
