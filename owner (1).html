<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة المالك</title>
<style>
  body { margin:0; font-family:Cairo, Tahoma, Arial, sans-serif; background:#0F2340; color:#fff; padding:18px; min-height:100vh; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { color:#D4AF37; margin:0; text-shadow:0 0 12px rgba(212,175,55,.7); }
  h3 { color:#E8C96A; margin:0 0 10px; }
  .card { background:#132A5A; border:1.5px solid #D4AF37; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 0 18px rgba(212,175,55,.25); overflow-x:auto; }
  .login { max-width:420px; margin:60px auto; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:linear-gradient(145deg,#1E3E85,#12275A); border:1.5px solid #D4AF37; border-radius:12px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:28px; text-shadow:0 0 12px rgba(255,255,255,.7); }
  input, select, button, textarea { font:inherit; padding:9px; border-radius:8px; border:1px solid #D4AF37; margin:3px; box-sizing:border-box; }
  input, select, textarea { background:#0F2340; color:#fff; }
  input.full { width:100%; margin:6px 0; }
  button { background:linear-gradient(135deg,#D4AF37,#E8C96A); color:#0F2340; font-weight:bold; cursor:pointer; }
  button.red { background:#b91c1c; color:#fff; }
  .bell { position:relative; width:46px; height:46px; border-radius:50%; font-size:22px; cursor:pointer;
    box-shadow:0 0 18px rgba(212,175,55,.8); background:#132A5A; border:1.5px solid #D4AF37; color:#fff; }
  .badge { position:absolute; top:-6px; left:-6px; background:#dc2626; color:#fff; border-radius:12px; padding:1px 7px; font-size:12px; }
  #bellList { display:none; position:absolute; top:52px; left:0; width:320px; max-height:360px; overflow:auto; z-index:9;
    background:#132A5A; border:1.5px solid #D4AF37; border-radius:12px; padding:10px; box-shadow:0 0 24px rgba(212,175,55,.5); }
  .wrapBell { position:relative; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { border:1px solid #334e8c; padding:6px; text-align:center; vertical-align:middle; }
  th { background:#1E3E85; color:#E8C96A; }
  td.r { text-align:right; }
  img.proof { max-width:120px; border-radius:8px; border:1px solid #D4AF37; }
  .muted { color:#94a3b8; }
  #msg { margin:10px 0; color:#E8C96A; min-height:20px; }
  .hidden { display:none; }
</style>
</head>
<body>

<div id="loginBox" class="card login">
  <h3>تسجيل دخول المالك</h3>
  <input id="em" class="full" type="email" placeholder="البريد الإلكتروني">
  <input id="pw" class="full" type="password" placeholder="كلمة المرور">
  <button onclick="login()" style="width:100%;margin-top:8px">دخول</button>
  <div id="loginMsg" style="color:#E8C96A;margin-top:10px;min-height:20px"></div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <h1>لوحة المالك</h1>
<p><a href="index.html" onclick="if(history.length>1){history.back();return false;}" style="color:#F5D76E">← العودة إلى التطبيق</a></p>
    <div class="wrapBell">
      <button class="bell" onclick="toggleBell()" title="الإشعارات">🔔<span id="bellCount" class="badge" style="display:none">0</span></button>
      <div id="bellList"></div>
    </div>
  </div>
  <div id="msg"></div>

  <div class="stats">
    <div class="stat"><span>وصولات بانتظار المراجعة</span><b id="sPending">0</b></div>
    <div class="stat"><span>رسائل دعم بلا رد</span><b id="sMsgNoReply">0</b></div>
    <div class="stat"><span>اشتراكات نشطة</span><b id="sActive">0</b></div>
    <div class="stat"><span>مدارس مسجلة</span><b id="sSchools">0</b></div>
  </div>

  <div class="card">
    <h3>طلبات الدفع (CCP)</h3>
    <table id="payTbl"></table>
  </div>

  <div class="card">
    <h3>رسائل الدعم الفني والرد عليها</h3>
    <table id="msgTbl"></table>
  </div>

  <div class="card">
    <h3>حساب استلام نقود الخطط</h3>
    <input id="pmName" placeholder="اسم صاحب الحساب" style="width:100%;max-width:420px">
    <input id="pmNum" placeholder="رقم الحساب البريدي (CCP)" style="width:100%;max-width:420px">
    <button onclick="savePayTarget()">💾 حفظ</button>
  </div>

  <div class="card">
    <h3>الخطط: الأسعار والحدود (تنعكس على كل المدارس فورا)</h3>
    <table id="planTbl"></table>
  </div>

  <div class="card">
    <h3>منح حساب مجاني</h3>
    <input id="gEmail" type="email" placeholder="بريد مدير المؤسسة" style="width:100%;max-width:360px">
    <select id="gPlan"><option value="basic">أساسي</option><option value="pro">احترافي</option><option value="pro_duo">شبكة مدرستين</option></select>
    <select id="gMonths"><option value="1">شهر</option><option value="12">سنة</option></select>
    <button onclick="grant()">منح</button>
  </div>

  <div class="card">
    <h3>الاشتراكات</h3>
    <table id="subTbl"></table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://lhbyvjlwbeydwplohiso.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoYnl2amx3YmV5ZHdwbG9oaXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDE0OTAsImV4cCI6MjEwODE3NzQ5MH0.bdBRGrxsfmkWjeesSGm9gPAeTieot-AvNuCEHQ7gzpU';
  const OWNER_EMAIL = 'abdlkarimtifoun96@gmail.com';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const say = t => $('msg').textContent = t;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const day = v => v ? String(v).slice(0, 10) : '';
  let unanswered = [];

  // الحماية الحقيقية في قاعدة البيانات (RLS والدوال). هذا الفحص للعرض فقط.
  async function login() {
    $('loginMsg').textContent = 'جاري الدخول...';
    const slow = setTimeout(() => { $('loginMsg').textContent = 'الاتصال يتأخر. افتح Console (زر F12) وأرسل لي أي سطر أحمر، ثم جرّب تحديث الصفحة'; }, 12000);
    try {
      const { data, error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
      clearTimeout(slow);
      console.log('signIn result', { ok: !!data?.session, error: error?.message });
      if (error) { $('loginMsg').textContent = 'خطأ: ' + error.message; return; }
      $('loginMsg').textContent = 'تم الدخول، جاري فتح اللوحة...';
      await start();
    } catch (e) {
      clearTimeout(slow);
      console.log('login exception', e);
      $('loginMsg').textContent = 'خطأ: ' + e.message;
    }
  }

  async function start() {
    const { data: { user } } = await db.auth.getUser();
    if (!user) { $('loginBox').classList.remove('hidden'); $('app').classList.add('hidden'); console.log('no session after login'); return; }
    if ((user.email || '').toLowerCase() !== OWNER_EMAIL) {
      $('loginBox').classList.remove('hidden'); $('app').classList.add('hidden');
      $('loginMsg').textContent = 'هذا الحساب ليس حساب المالك';
      return;
    }
    window.OWNER_ID = user.id;
    $('loginBox').classList.add('hidden');
    $('app').classList.remove('hidden');
    loadAll();
  }

  async function loadAll() {
    await Promise.all([loadStats(), loadPayments(), loadMsgs(), loadSubs(), loadPlans(), loadPayTarget()]);
    updateBell();
  }

  async function loadStats() {
    const count = async q => { const { count } = await q; return count || 0; };
    $('sPending').textContent = await count(db.from('payment_proofs').select('id', { count: 'exact', head: true }).eq('status', 'pending'));
    $('sMsgNoReply').textContent = await count(db.from('support_messages').select('id', { count: 'exact', head: true }).is('reply', null));
    $('sActive').textContent = await count(db.from('subscriptions').select('id', { count: 'exact', head: true }).eq('status', 'active'));
    $('sSchools').textContent = await count(db.from('schools').select('id', { count: 'exact', head: true }));
  }

  async function loadPayments() {
    const { data, error } = await db.from('payment_proofs')
      .select('id, plan_id, months, written_name, receipt_no, image_path, status, created_at, schools(name)')
      .order('created_at', { ascending: false });
    if (error) return say('لا يمكن قراءة الطلبات: ' + error.message);
    const rows = await Promise.all((data || []).map(async p => {
      const { data: s } = await db.storage.from('payment-proofs').createSignedUrl(p.image_path, 600);
      const actions = (p.status === 'pending'
        ? `<button onclick="review('${p.id}', true)">تأكيد</button><button class="red" onclick="review('${p.id}', false)">رفض</button>`
        : '') + `<button class="red" onclick="delPayment('${p.id}')">🗑️ حذف</button>`;
      return `<tr><td>${esc(p.schools?.name || '')}</td><td>${esc(p.plan_id)} (${p.months === 12 ? 'سنة' : 'شهر'})</td>
        <td>${esc(p.written_name)}</td><td>${esc(p.receipt_no || '—')}</td>
        <td>${s ? `<a href="${s.signedUrl}" target="_blank"><img class="proof" src="${s.signedUrl}"></a>` : '—'}</td>
        <td>${esc(p.status)}</td><td>${actions}</td></tr>`;
    }));
    $('payTbl').innerHTML = '<tr><th>المؤسسة</th><th>الخطة</th><th>الاسم في الوصل</th><th>رقم الوصل</th><th>الصورة</th><th>الحالة</th><th>إجراء</th></tr>' + rows.join('');
  }

  async function loadMsgs() {
    const { data } = await db.from('support_messages')
      .select('id, full_name, institution, email, message, created_at, reply, sender_id')
      .order('created_at', { ascending: false }).limit(100);
    unanswered = (data || []).filter(m => !m.reply);
    $('msgTbl').innerHTML = '<tr><th>التاريخ</th><th>الاسم</th><th>المؤسسة</th><th>البريد</th><th>الرسالة</th><th>الرد</th></tr>' +
      (data || []).map(m => `<tr>
        <td>${day(m.created_at)}</td><td>${esc(m.full_name)}</td><td>${esc(m.institution || '')}</td><td>${esc(m.email)}</td>
        <td class="r" style="max-width:320px;white-space:pre-wrap">${esc(m.message)}</td>
        <td style="min-width:260px">${m.reply
          ? `<span style="color:#86efac">تم الرد</span><br><small class="muted">${esc(m.reply)}</small>`
          : `<textarea id="rp-${m.id}" rows="2" style="width:100%" placeholder="اكتب ردك"></textarea>
             <button onclick="sendReply('${m.id}')">📤 إرسال الرد</button>`}</td></tr>`).join('');
  }

  async function sendReply(id) {
    const m = (await db.from('support_messages').select('*').eq('id', id).single()).data;
    const txt = $('rp-' + id).value.trim();
    if (!txt) return say('اكتب الرد أولا');
    const { error } = await db.from('support_messages').update({ reply: txt, replied_at: new Date().toISOString(), replied_by: window.OWNER_ID }).eq('id', id);
    if (error) return say('خطأ: ' + error.message);
    const { error: e2 } = await db.functions.invoke('send-support-notification', {
      body: { action: 'reply', to: m.email, full_name: m.full_name, original: m.message, reply: txt } });
    say(e2 ? 'حُفظ الرد داخل التطبيق، لكن تعذر إرسال البريد إلى المرسل' : 'تم إرسال الرد ✅');
    loadAll();
  }

  async function loadSubs() {
    const { data } = await db.from('subscriptions')
      .select('plan_id, status, start_date, end_date, is_manual_grant, schools(name)')
      .order('created_at', { ascending: false }).limit(100);
    $('subTbl').innerHTML = '<tr><th>المؤسسة</th><th>الخطة</th><th>الحالة</th><th>البداية</th><th>النهاية</th><th>منحة يدوية</th></tr>' +
      (data || []).map(s => `<tr><td>${esc(s.schools?.name || '')}</td><td>${esc(s.plan_id)}</td><td>${esc(s.status)}</td>
        <td>${day(s.start_date)}</td><td>${day(s.end_date)}</td><td>${s.is_manual_grant ? 'نعم' : 'لا'}</td></tr>`).join('');
  }

  // الجرس: رسائل بلا رد + وصولات بانتظار المراجعة
  async function updateBell() {
    const pending = (await db.from('payment_proofs').select('id', { count: 'exact', head: true }).eq('status', 'pending')).count || 0;
    const n = unanswered.length + pending;
    $('bellCount').textContent = n;
    $('bellCount').style.display = n ? 'inline-block' : 'none';
    $('bellList').innerHTML = (unanswered.length ? unanswered.map(m =>
        `<div style="padding:8px 0;border-bottom:1px solid rgba(212,175,55,.3)"><b>رسالة دعم</b> — ${esc(m.full_name)}<br>
         <small class="muted">${esc(String(m.message).slice(0, 80))}</small></div>`).join('')
      : '<p class="muted">لا توجد رسائل بلا رد</p>')
      + `<div style="padding:8px 0"><b>وصولات بانتظار المراجعة:</b> ${pending}</div>`;
  }
  function toggleBell() { const b = $('bellList'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }

  async function review(id, approve) {
    const { error } = await db.rpc('owner_review_payment', { p_id: id, p_approve: approve });
    if (error) return say('خطأ: ' + error.message);
    say(approve ? 'تم تأكيد الدفع وتفعيل الاشتراك ✅' : 'تم رفض الطلب');
    loadAll();
  }

  async function delPayment(id) {
    if (!confirm('حذف الوصل نهائيا من المخزن والسجل؟')) return;
    const { error } = await db.rpc('owner_delete_payment', { p_id: id });
    if (error) return say('خطأ: ' + error.message);
    say('تم حذف الوصل');
    loadAll();
  }

  async function grant() {
    const { error } = await db.rpc('owner_grant_free', {
      p_email: $('gEmail').value.trim(), p_plan: $('gPlan').value, p_months: parseInt($('gMonths').value, 10) });
    if (error) return say('خطأ: ' + error.message);
    say('تم منح الاشتراك المجاني ✅');
    loadAll();
  }

  async function loadPayTarget() {
    const { data } = await db.from('app_settings').select('value').eq('key', 'payment_target').maybeSingle();
    if (data && data.value) { $('pmName').value = data.value.name || ''; $('pmNum').value = data.value.ccp || ''; }
  }

  async function savePayTarget() {
    const { error } = await db.from('app_settings').upsert({ key: 'payment_target', value: { name: $('pmName').value.trim(), ccp: $('pmNum').value.trim() }, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    say(error ? 'خطأ: ' + error.message : 'تم حفظ حساب الاستلام ✅');
  }

  async function loadPlans() {
    const { data } = await db.from('plans').select('*').order('price_month', { ascending: true, nullsFirst: true });
    const num = v => v === null || v === undefined ? '' : v;
    $('planTbl').innerHTML = '<tr><th>الخطة</th><th>الاسم</th><th>حد التلاميذ</th><th>حد الأساتذة (فارغ = غير محدود)</th><th>سعر الشهر</th><th>سعر السنة</th><th>مفعّلة</th><th>حفظ</th></tr>' +
      (data || []).map(p => `<tr data-id="${esc(p.id)}">
        <td>${esc(p.id)}</td>
        <td><input class="pn" value="${esc(p.name_ar)}"></td>
        <td><input class="pst" type="number" min="0" value="${num(p.max_students)}" style="width:90px"></td>
        <td><input class="pte" type="number" min="0" value="${num(p.max_teachers)}" style="width:90px"></td>
        <td><input class="pm" type="number" min="0" value="${num(p.price_month)}" style="width:90px"></td>
        <td><input class="py" type="number" min="0" value="${num(p.price_year)}" style="width:90px"></td>
        <td><input class="pa" type="checkbox" ${p.active ? 'checked' : ''}></td>
        <td><button onclick="savePlan('${esc(p.id)}', this)">💾</button></td></tr>`).join('');
  }

  async function savePlan(id, btn) {
    const tr = btn.closest('tr');
    const val = c => { const v = tr.querySelector(c).value.trim(); return v === '' ? null : parseInt(v, 10); };
    const { error } = await db.from('plans').update({
      name_ar: tr.querySelector('.pn').value.trim(),
      max_students: val('.pst'), max_teachers: val('.pte'),
      price_month: val('.pm'), price_year: val('.py'),
      active: tr.querySelector('.pa').checked }).eq('id', id);
    say(error ? 'خطأ: ' + error.message : 'تم حفظ الخطة ✅');
  }

  db.auth.onAuthStateChange(() => start());
  start();
</script>
</body>
</html>
