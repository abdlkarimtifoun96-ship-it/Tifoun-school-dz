<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدفع عبر CCP - TIFO</title>
<style>
  body { margin:0; font-family:Cairo, Tahoma, Arial, sans-serif; background:radial-gradient(ellipse at top,#1E3E85 0%,#0F2340 65%,#0A1931 100%); color:#fff; min-height:100vh; padding:24px 14px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { color:#D4AF37; text-align:center; text-shadow:0 0 14px rgba(212,175,55,.7); margin:0 0 16px; }
  .card { background:linear-gradient(145deg,rgba(30,62,133,.6),rgba(19,42,90,.85)); border:1.5px solid #D4AF37; border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 0 22px rgba(212,175,55,.3); }
  .ccp { font-size:20px; font-weight:bold; text-align:center; color:#fde68a; text-shadow:0 0 12px rgba(212,175,55,.8); line-height:1.9; }
  .rule { background:rgba(212,175,55,.12); border:1px dashed #D4AF37; border-radius:10px; padding:12px; line-height:1.9; color:#fef3c7; margin-top:12px; }
  label { display:block; margin:12px 0 4px; color:#E8C96A; }
  input, select { width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:1px solid #D4AF37; background:#0F2340; color:#fff; font:inherit; }
  button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:12px; font:inherit; font-weight:bold; color:#0F2340; cursor:pointer; background:linear-gradient(135deg,#D4AF37,#F5E08A); box-shadow:0 0 20px rgba(212,175,55,.7); }
  #msg { margin-top:12px; text-align:center; color:#fde68a; min-height:24px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>الدفع عبر CCP</h1>
  <p style="text-align:center"><a href="index.html" target="_top" style="color:#F5D76E">العودة إلى التطبيق لإنشاء المؤسسة بعد رفع الوصل</a></p>

  <div class="card">
    <div class="ccp">رقم CCP: <span id="ccpNum"></span><br>الاسم: <span id="ccpName"></span></div>
    <div class="rule">
      <b>قبل تصوير الوصل:</b> اكتب بخط واضح <b>اسم مؤسستك ورقم هاتفك</b> في مكان فارغ أبيض في الوصل.<br>
      ممنوع الكتابة فوق المبلغ، أو فوق رقم حساب CCP، أو في الخلف، أو فوق الختم.<br>
      أي وصل بدون اسم، أو مكتوب فوقه، سيُرفض.
    </div>
  </div>

  <div id="loginBox" class="card">
    <label>البريد الإلكتروني للمدير</label>
    <input id="em" type="email">
    <label>كلمة المرور</label>
    <input id="pw" type="password">
    <button onclick="login()">دخول</button>
  </div>

  <form id="formBox" class="card hidden" onsubmit="submitProof(event)">
    <label>الخطة</label>
    <select id="plan">
      <option value="basic">أساسي</option>
      <option value="pro">احترافي</option>
      <option value="pro_duo">شبكة مدرستين</option>
    </select>
    <label>المدة</label>
    <select id="months"><option value="1">شهر</option><option value="12">سنة</option></select>
    <label>الاسم الذي كتبته في الوصل (إجباري)</label>
    <input id="wname" required minlength="3">
    <label>رقم الوصل (اختياري)</label>
    <input id="rno">
    <label>📷 صورة الوصل: اضغط هنا لاختيار صورة من الهاتف أو الكمبيوتر</label>
    <input id="file" type="file" accept="image/*" required>
    <button type="submit">إرسال الوصل</button>
  </form>

  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
  // ضع رقم CCP واسم صاحبه هنا
  const CCP_NUMBER = 'ضع_رقم_CCP_هنا';
  const CCP_NAME = 'ضع_اسم_صاحب_الحساب_هنا';

  const SUPABASE_URL = 'https://lhbyvjlwbeydwplohiso.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoYnl2amx3YmV5ZHdwbG9oaXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDE0OTAsImV4cCI6MjEwODE3NzQ5MH0.bdBRGrxsfmkWjeesSGm9gPAeTieot-AvNuCEHQ7gzpU';
  if (!window.supabase) { document.getElementById('msg').textContent = 'تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم حدّث الصفحة.'; }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const say = t => $('msg').textContent = t;

  $('ccpNum').textContent = CCP_NUMBER;
  $('ccpName').textContent = CCP_NAME;
  db.from('app_settings').select('value').eq('key', 'payment_target').maybeSingle().then(({ data }) => {
    if (data && data.value) { $('ccpNum').textContent = data.value.ccp || CCP_NUMBER; $('ccpName').textContent = data.value.name || CCP_NAME; }
  });
  const pre = new URLSearchParams(location.search).get('plan');
  if (pre && ['basic','pro','pro_duo'].includes(pre)) $('plan').value = pre;

  async function showState() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) $('msg').textContent = 'سجّل الدخول بحساب المدير لإرسال الوصل';
    $('loginBox').classList.toggle('hidden', !!session);
    $('formBox').classList.toggle('hidden', !session);
  }

  async function login() {
    const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (error) return say('خطأ: ' + error.message);
    say(''); showState();
  }

  // ضغط الصورة مهما كان حجمها ونوعها، ثم تحويلها إلى JPEG
  function compressImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error('تعذر تحويل الصورة')), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('تعذر قراءة هذه الصورة، جرّب صورة أخرى')); };
      img.src = url;
    });
  }

  async function sha256Hex(blob) {
    const buf = await blob.arrayBuffer();
    const d = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function submitProof(e) {
    e.preventDefault();
    const { data: { user } } = await db.auth.getUser();
    if (!user) return say('سجّل الدخول أولا');
    const { data: prof, error: pe } = await db.from('profiles').select('school_id, role').eq('id', user.id).single();
    if (pe || !prof) return say('سجّل الدخول بالحساب الذي ستنشئ به المؤسسة');
    if (prof.school_id && prof.role !== 'directeur') return say('هذه الصفحة للمدير فقط');
    const name = $('wname').value.trim();
    if (name.length < 3) return say('اكتب الاسم الذي كتبته في الوصل');
    const f = $('file').files[0];
    if (!f) return say('ارفع صورة الوصل');
    try {
      say('جاري الرفع...');
      const blob = await compressImage(f);
      const hash = await sha256Hex(blob);
      const path = `${prof.school_id || user.id}/${Date.now()}.jpg`;
      const up = await db.storage.from('payment-proofs').upload(path, blob, { contentType: 'image/jpeg' });
      if (up.error) return say('فشل رفع الصورة: ' + up.error.message);
      const { error } = await db.from('payment_proofs').insert({
        school_id: prof.school_id || null, sender_id: user.id, plan_id: $('plan').value,
        months: parseInt($('months').value, 10), written_name: name,
        receipt_no: $('rno').value.trim() || null, image_path: path, image_hash: hash });
      if (error) {
        await db.storage.from('payment-proofs').remove([path]);
        return say(/duplicate|unique/i.test(error.message) ? 'هذا الوصل سبق رفعه' : 'خطأ: ' + error.message);
      }
      $('formBox').reset();
      say('تم استلام الوصل ✅ سيراجعه المالك، ويُفعَّل اشتراكك بعد التأكيد.');
    } catch (err) { say(err.message); }
  }

  db.auth.onAuthStateChange(() => showState());
  showState();
</script>
</body>
</html>
